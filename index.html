<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAOJ STORE | Alta Cosmética, Accesorios & Moda Chic</title>
  <meta name="description" content="Tu boutique favorita de alta cosmética, maquillaje, accesorios y moda chic con entregas en Portoviejo, Manta y envíos Servientrega a todo el Ecuador." />
  <meta name="theme-color" content="#18181B" />

  <!-- Open Graph & Social Sharing Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_EC" />
  <meta property="og:site_name" content="KAOJ STORE" />
  <meta property="og:title" content="KAOJ STORE | Alta Cosmética, Accesorios & Moda Chic" />
  <meta property="og:description" content="Maquillaje de alta gama, accesorios chic y moda boutique. Entregas en Portoviejo, Manta y envíos seguros a todo el Ecuador." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=1200&auto=format&fit=crop&q=80" />

  <!-- PWA Favicon, Manifest & iOS Support (PNG para Android / iOS) -->
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kaoj Store" />

  <!-- Preconnect y DNS Prefetch para alto rendimiento en 4G -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://uxptcckcwcyaivurhxzh.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kaoj: {
              50: '#FDF8F9',
              100: '#FCE7F3',
              200: '#FBCFE8',
              300: '#F472B6',
              400: '#E11D48',
              500: '#BE185D',
              600: '#9D174D',
              700: '#831843',
              800: '#500724',
              900: '#18181B',
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Playfair Display + Plus Jakarta Sans + Barcode 39 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw !important;
      width: 100% !important;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFAFC;
    }
    .font-serif-kaoj {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .font-barcode {
      font-family: 'Libre Barcode 39 Text', monospace;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F4F4F6;
    }
    ::-webkit-scrollbar-thumb {
      background: #E4E4E7;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF2E93;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    @keyframes marquee-pasarela {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }
    .animate-marquee-pasarela {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee-pasarela 24s linear infinite;
    }
    .animate-marquee-pasarela:hover {
      animation-play-state: paused;
    }
    @media print {
      @page {
        size: auto;
        margin: 4mm;
      }
      body {
        visibility: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      header, footer, nav, aside, .no-print {
        display: none !important;
      }
      .fixed.inset-0 {
        position: static !important;
        background: transparent !important;
        padding: 0 !important;
        display: block !important;
      }
      .bg-white.rounded-3xl.max-w-xl {
        box-shadow: none !important;
        padding: 0 !important;
        max-width: 100% !important;
        border: none !important;
        margin: 0 !important;
      }
      #servientrega-print-area {
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        max-width: 105mm !important;
        margin: 0 auto !important;
        padding: 10px !important;
        background: white !important;
        border: 2px solid #047857 !important;
        box-shadow: none !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      #servientrega-print-area * {
        visibility: visible !important;
      }
    }
  </style>
</head>
<body class="text-zinc-900 antialiased selection:bg-[#FF2E93] selection:text-white min-h-screen flex flex-col overflow-x-hidden w-full max-w-full">

  <!-- CONTENEDOR REACT CON PRELOADER BOUTIQUE ELEGANTE -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FDFAFC; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="text-align: center;">
        <h1 style="font-family: 'Playfair Display', Georgia, serif; font-size: 2.75rem; font-weight: 900; color: #FF007F; letter-spacing: 0.25em; margin: 0; line-height: 1;">KAOJ</h1>
        <span style="font-size: 0.75rem; letter-spacing: 0.5em; color: #18181B; font-weight: 800; display: block; margin-top: 0.4rem;">STORE</span>
        <div style="margin-top: 1.5rem; width: 48px; height: 3px; background: #FF007F; border-radius: 9999px; margin-left: auto; margin-right: auto; animation: pulse-glow 1.5s infinite ease-in-out;"></div>
        <p style="font-size: 0.75rem; color: #A1A1AA; font-weight: 600; margin-top: 0.75rem; letter-spacing: 0.05em;">Cargando boutique exclusiva...</p>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
