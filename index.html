    function playOrderNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        // Chime boutique ascendente armonioso: C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);
          gain.gain.setValueAtTime(0.35, now + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.38);
        });
      } catch (e) {
        console.warn('Audio chime notice:', e);
      }
    }

    // Disparador Universal de Notificaciones Push (Android Chrome WebAPK + iOS 16.4+ PWA + Desktop)
    async function triggerPushNotification(title, body, extraOptions = {}) {
      try {
        if (typeof window === 'undefined' || !('Notification' in window)) {
          return {
            success: false,
            reason: 'unsupported'
          };
        }
        let permission = Notification.permission;
        if (permission !== 'granted') {
          try {
            permission = await Notification.requestPermission();
          } catch (pErr) {
            permission = await new Promise(resolve => Notification.requestPermission(resolve));
          }
        }
        if (permission !== 'granted') {
          return {
            success: false,
            reason: 'denied'
          };
        }
        const notifOptions = {
          body: body || 'Alerta de Kaoj Store',
          icon: './icons/icon-admin-192.png',
          badge: './icons/favicon.png',
          vibrate: [250, 100, 250, 100, 350],
          tag: extraOptions.tag || 'kaoj-alert-' + Date.now(),
          renotify: true,
          requireInteraction: true,
          data: {
            url: './admin.html#/admin/orders'
          },
          ...extraOptions
        };

        // 1. Service Worker showNotification: OBLIGATORIO en Android y en iOS PWA (Apple Home Screen)
        if ('serviceWorker' in navigator) {
          try {
            const reg = await navigator.serviceWorker.ready;
            if (reg && typeof reg.showNotification === 'function') {
              await reg.showNotification(title, notifOptions);
              return {
                success: true,
                method: 'serviceworker'
              };
            }
          } catch (swErr) {
            console.warn('SW notification fallback:', swErr);
          }
        }

        // 2. Fallback para macOS Safari / Desktop Chrome (new Notification)
        try {
          const notif = new Notification(title, notifOptions);
          if (notif) {
            notif.onclick = () => {
              window.focus();
              window.location.hash = '#/admin/orders';
            };
          }
          return {
            success: true,
            method: 'direct'
          };
        } catch (directErr) {
          console.warn('Direct notification failed:', directErr);
        }
      } catch (err) {
        console.error('Error enviando notificación push:', err);
      }
      return {
        success: false,
        reason: 'failed'
      };
    }

    // VERIFICADOR DE CÓDIGOS QR DE COMPROBANTES PICHINCHA / DEUNA
    // =========================================================================
    function parsePichinchaReceiptQR(text) {
      if (!text || typeof text !== 'string') return null;
      const trimmed = text.trim();
      const parts = trimmed.split(':');
      if (parts.length < 8) return null;
      const isPichincha = trimmed.toUpperCase().includes('PICHINCHA') || parts[0].trim() === 'ONLINE' || trimmed.toUpperCase().includes('DEUNA') || trimmed.toUpperCase().includes('BP_TO_');
      if (!isPichincha) return null;
      const type = parts[1] ? parts[1].trim() : '';
      const bank = parts[2] ? parts[2].trim() : 'Banco Pichincha';
      const senderName = parts[3] ? parts[3].trim() : '';
      const senderAcc = parts[4] ? parts[4].trim() : '';
      const channel = parts[5] ? parts[5].trim() : '';
      const receiverName = parts[6] ? parts[6].trim() : '';
      const receiverAcc = parts[7] ? parts[7].trim() : '';
      const amount = parseFloat(parts[8]) || 0;
      const timestampRaw = parts[9] ? parts[9].trim() : '';
      const uuid = parts[10] ? parts[10].trim() : '';
      const secuencial = parts[11] ? parts[11].trim() : '';
      const hash = parts[12] ? parts[12].trim() : '';
      let transferDate = '';
      if (timestampRaw && /^\d+$/.test(timestampRaw)) {
        try {
          const tsNum = parseInt(timestampRaw, 10);
          const dateObj = new Date(tsNum > 1e11 ? tsNum : tsNum * 1000);
          if (!isNaN(dateObj.getTime())) {
            transferDate = dateObj.toLocaleDateString('es-EC', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });
          }
        } catch (_) {}
      }
      return {
        raw: trimmed,
        type,
        bank,
        senderName,
        senderAcc,
        channel,
        receiverName,
        receiverAcc,
        amount,
        timestampRaw,
        transferDate,
        uuid,
        secuencial,
        hash
      };
    }

    // =========================================================================
    // PARSEADOR INTELIGENTE DE NOTIFICACIONES DE CORREO DEUNA! (notificaciones@deunaapp.com)
    // =========================================================================
    function parseDeunaNotificationEmail(rawText) {
      if (!rawText || typeof rawText !== 'string') return null;
      const text = rawText.trim();

      // 1. Número de transacción DeUna (10 a 18 dígitos numéricos)
      const txMatch = text.match(/(?:n[uú]mero\s+de\s+transacci[oó]n|transacci[oó]n|nro\s+tx)\s*[:\t ]*([0-9]{8,18})/i) || text.match(/\b([0-9]{12})\b/);

      // 2. Monto en USD (soporta $35,00 y $35.00)
      const amountMatch = text.match(/(?:monto\s*[:\t ]*|recibiste\s*)\$?([0-9]+(?:[.,][0-9]{2})?)/i);

      // 3. Nombre del ordenante / Emisor
      let senderMatch = text.match(/nombre\s+del\s+ordenante\s*[:\t ]*([^\n\r]+)/i);
      if (!senderMatch) {
        senderMatch = text.match(/recibiste\s+\$?[0-9.,]+\s+de\s*\n?\s*([^\n\r]+?)(?:\s+con\s+deuna|\n|$)/i);
      }

      // 4. Cuentas y fecha
      const destMatch = text.match(/cuenta\s+de\s+destino\s*[:\t ]*([^\n\r]+)/i);
      const origMatch = text.match(/cuenta\s+de\s+origen\s*[:\t ]*([^\n\r]+)/i);
      const dateMatch = text.match(/fecha\s*[:\t ]*([^\n\r]+)/i);
      const transactionId = txMatch ? txMatch[1].trim() : '';
      const amount = amountMatch ? parseFloat(amountMatch[1].replace(',', '.')) : 0;
      const senderName = senderMatch ? senderMatch[1].trim() : '';
      const destAccount = destMatch ? destMatch[1].trim() : '';
      const origAccount = origMatch ? origMatch[1].trim() : '';
      const paymentDate = dateMatch ? dateMatch[1].trim() : '';
      if (!transactionId && !amount) return null;
      return {
        transactionId,
        amount,
        senderName,
        destAccount,
        origAccount,
        paymentDate,
        raw: text
      };
    }
    function scanQRCodeFromImage(imageSource) {
      return new Promise(resolve => {
        try {
          if (typeof window.jsQR !== 'function') {
            return resolve(null);
          }
          const img = new Image();
          img.crossOrigin = 'anonymous';
          const runDetection = () => {
            try {
              const origW = img.naturalWidth || img.width;
              const origH = img.naturalHeight || img.height;
              if (!origW || !origH) return resolve(null);
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d', {
                willReadFrequently: true
              });
              const maxDim = 1200;
              const scale = Math.min(1, maxDim / Math.max(origW, origH));
              const width = Math.round(origW * scale);
              const height = Math.round(origH * scale);
              canvas.width = width;
              canvas.height = height;
              ctx.drawImage(img, 0, 0, width, height);

              // 1. Imagen completa
              let imgData = ctx.getImageData(0, 0, width, height);
              let qr = window.jsQR(imgData.data, width, height, {
                inversionAttempts: 'attemptBoth'
              });
              if (qr && qr.data) return resolve(qr.data);

              // 2. Mitad inferior (típico en vouchers Banco Pichincha)
              const cropY = Math.floor(height * 0.35);
              const cropH = height - cropY;
              let bottomData = ctx.getImageData(0, cropY, width, cropH);
              let qrBottom = window.jsQR(bottomData.data, width, cropH, {
                inversionAttempts: 'attemptBoth'
              });
              if (qrBottom && qrBottom.data) return resolve(qrBottom.data);

              // 3. Mitad superior
              let topData = ctx.getImageData(0, 0, width, Math.floor(height * 0.65));
              let qrTop = window.jsQR(topData.data, width, Math.floor(height * 0.65), {
                inversionAttempts: 'attemptBoth'
              });
              if (qrTop && qrTop.data) return resolve(qrTop.data);
              resolve(null);
            } catch (err) {
              console.warn('Error escaneando QR:', err);
              resolve(null);
            }
          };
          if (typeof File !== 'undefined' && imageSource instanceof File || typeof Blob !== 'undefined' && imageSource instanceof Blob) {
            const reader = new FileReader();
            reader.onload = e => {
              img.onload = runDetection;
              img.onerror = () => resolve(null);
              img.src = e.target.result;
            };
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(imageSource);
          } else if (typeof imageSource === 'string') {
            img.onload = runDetection;
            img.onerror = () => resolve(null);
            img.src = imageSource;
          } else {
            resolve(null);
          }
        } catch (e) {
          resolve(null);
        }
      });
    }

      // Detección de URLs de Video (Directos MP4/WebM/MOV o YouTube / Shorts)
      function isVideoUrl(url) {
        if (!url || typeof url !== 'string') return false;
        const clean = url.trim().toLowerCase();
        if (clean.match(/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i)) return true;
        if (clean.includes('youtube.com/watch') || clean.includes('youtu.be/') || clean.includes('youtube.com/shorts/')) return true;
        if (clean.includes('vimeo.com/')) return true;
        return false;
      }

      // Convertir URLs de YouTube / Shorts a URL incrustable (embed)
      function getYouTubeEmbedUrl(url) {
        if (!url || typeof url !== 'string') return null;
        const u = url.trim();
        const shortsMatch = u.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/);
        if (shortsMatch && shortsMatch[1]) {
          return `https://www.youtube-nocookie.com/embed/${shortsMatch[1]}?autoplay=1&mute=1&playsinline=1&rel=0`;
        }
        const ytMatch = u.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
        if (ytMatch && ytMatch[1]) {
          return `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&mute=1&playsinline=1&rel=0`;
        }
        return null;
      }

      // Obtener el video de un producto (desde columna directa, variante[0] o imágenes)
      function getProductVideo(product) {
        if (!product) return '';
        if (product.video && typeof product.video === 'string' && product.video.trim()) {
          return product.video.trim();
        }
        if (product.variants?.[0]?.video && typeof product.variants[0].video === 'string' && product.variants[0].video.trim()) {
          return product.variants[0].video.trim();
        }
        if (Array.isArray(product.images)) {
          const v = product.images.find(img => isVideoUrl(img));
          if (v) return v.trim();
        }
        return '';
      }

      // Obtener todos los medios de un producto (Foto principal SIEMPRE primero, luego fotos de galería/variantes y video)
      function getProductMedia(product) {
        if (!product) return [{
          type: 'image',
          url: 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'
        }];
        const media = [];
        const videoUrl = getProductVideo(product);

        // 1. Fotos del producto (la foto principal está garantizada en images[0])
        const images = getProductImages(product);
        images.forEach(img => {
          if (img && img !== videoUrl) {
            media.push({
              type: 'image',
              url: img
            });
          }
        });

        // 2. Video del producto como elemento secundario / complementario en la galería
        if (videoUrl) {
          media.push({
            type: 'video',
            url: videoUrl,
            isYouTube: !!getYouTubeEmbedUrl(videoUrl),
            embedUrl: getYouTubeEmbedUrl(videoUrl)
          });
        }
        return media.length > 0 ? media : [{
          type: 'image',
          url: product.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'
        }];
      }

      // Obtener todas las imágenes de un producto (La foto principal SIEMPRE en el índice 0, luego galería y variantes)
      function getProductImages(product) {
        if (!product) return ['https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'];
        const list = [];

        // 1. FOTO PRINCIPAL ABSOLUTA (Garantiza primera impresión en catálogo y vista rápida)
        const mainPhoto = product.image && typeof product.image === 'string' && product.image.trim() && !isVideoUrl(product.image) ? product.image.trim() : null;
        if (mainPhoto) {
          list.push(mainPhoto);
        }

        // 2. Array `images` directo del producto (sin repetir la foto principal)
        if (Array.isArray(product.images)) {
          product.images.forEach(img => {
            if (img && typeof img === 'string' && img.trim() && !isVideoUrl(img) && !list.includes(img.trim())) {
              list.push(img.trim());
            }
          });
        }

        // 3. Galería almacenada en variantes[0].gallery (compatibilidad)
        if (Array.isArray(product.variants?.[0]?.gallery)) {
          product.variants[0].gallery.forEach(img => {
            if (img && typeof img === 'string' && img.trim() && !isVideoUrl(img) && !list.includes(img.trim())) {
              list.push(img.trim());
            }
          });
        }

        // 4. Fotos de variantes o tonos (secundarias para flechitas o al tocar el tono)
        (product.variants || []).forEach(v => {
          if (v.image && typeof v.image === 'string' && v.image.trim() && !isVideoUrl(v.image) && !list.includes(v.image.trim())) {
            list.push(v.image.trim());
          }
        });
        return list.length > 0 ? list : [product.image && !isVideoUrl(product.image) ? product.image : 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'];
      }

      // Métodos para cambiar de estado órdenes individualmente o por lote

      const handleBatchDeleteCancelledOrders = async () => {

        const adminPin = sessionStorage.getItem('kaoj_admin_pin') || localStorage.getItem('kaoj_admin_pin') || '';

        try {

          localStorage.setItem('kaoj_deleted_order_ids', JSON.stringify(newDeleted));

        for (const ord of cancelledSelected) {

            showToast(`✓ Pago DeUna de $${Number(data.amount).toFixed(2)} verificado con éxito (${data.sender_name || 'Titular verificado'})`, 'success');

      const [adminStockFilter, setAdminStockFilter] = useState('todos'); // 'todos', 'critico', 'agotados'

      useEffect(() => {

        const handleRouteFromHash = () => {
          let hash = window.location.hash || '#/';
          const isAdminEntry = Boolean(window.IS_ADMIN_APP || window.location.pathname.endsWith('admin.html') || window.location.pathname.includes('/admin/'));

          // 3. Reseñas públicas aprobadas para Social Proof

          // 4. Solicitudes de stock / lista de espera

            });

              setWaitlistLeads(waitlistData);
              try {
                localStorage.setItem('kaoj_waitlist_leads', JSON.stringify(waitlistData));

      // Carga de datos administrativos protegidos (Verificado en servidor vía RPC con PIN hasheado)
      async function fetchAdminData(passedPin = null) {
        try {
          const currentPin = passedPin || sessionStorage.getItem('kaoj_admin_pin') || localStorage.getItem('kaoj_admin_pin') || '';
          if (!currentPin) return;

            data: ords,

          } = await supabase.rpc('kaoj_admin_get_orders', {
            admin_pin: currentPin

          if (!oErr && ords) {
            setOrders(ords.filter(o => o.status !== 'eliminado' && o.status !== 'cancelado_eliminado' && !deletedIds.includes(o.id)));

            console.warn('kaoj_admin_get_orders RPC error:', oErr.message);

              data: fallbackOrds
            } = await supabase.from('kaoj_orders').select('*').order('created_at', {
              ascending: false
            });
            if (fallbackOrds && fallbackOrds.length > 0) {
              setOrders(fallbackOrds.filter(o => o.status !== 'eliminado' && o.status !== 'cancelado_eliminado' && !deletedIds.includes(o.id)));

              data: fallbackCusts
            } = await supabase.from('kaoj_customers').select('*').order('created_at', {
              ascending: false
            });
            if (fallbackCusts && fallbackCusts.length > 0) setCustomersList(fallbackCusts);

          } = await supabase.rpc('kaoj_admin_get_all_reviews', {

            setReviews(allRevs);
          } else if (rErr) {
            console.warn('kaoj_admin_get_all_reviews RPC error:', rErr.message);
            const {
              data: fallbackRevs
            } = await supabase.from('kaoj_reviews').select('*').order('created_at', {
              ascending: false
            });
            if (fallbackRevs && fallbackRevs.length > 0) setReviews(fallbackRevs);
          }
        } catch (err) {
          console.error('Error cargando datos de administración:', err);
        }
      }

      // Proceso de autenticación con Google y vinculación permanente del teléfono

      // =======================================================================
      // 2. SINCRONIZACIÓN SEGURA DE CARRITO EN SUPABASE (Sin sobrescritura destructiva)
      // =======================================================================
      useEffect(() => {
        try {
          localStorage.setItem('kaoj_cart', JSON.stringify(cart));
        } catch (e) {}

        // Solo sincronizar con la nube si el usuario está logueado Y ya se cargó el carrito inicial
        if (user && isCloudCartLoadedRef.current) {
          supabase.from('kaoj_carts').upsert({
            user_id: user.id,
            customer_code: customerProfile?.customer_code || '',
            items: cart,
            updated_at: new Date().toISOString()
          }, {
            onConflict: 'user_id'
          });
        }
      }, [cart, user, customerProfile]);

      // Saneamiento y sincronización de stock del carrito al abrirlo
      useEffect(() => {
        if (!isCartOpen || products.length === 0 || cart.length === 0) return;
        let hasAdjusted = false;
        const sanitized = cart.map(item => {
          const prod = products.find(p => p.id === item.productId);
          if (!prod || !prod.is_active) {
            hasAdjusted = true;
            return null;
          }
          const varObj = (prod.variants || []).find(v => v.name === item.variant);
          const currentStock = varObj ? Number(varObj.stock || 0) : 0;
          if (currentStock <= 0) {
            hasAdjusted = true;
            return null;
          }
          let newQty = item.qty;
          if (item.qty > currentStock) {
            newQty = currentStock;
            hasAdjusted = true;
          }
          const freshPrice = prod.discount_price ? Number(prod.discount_price) : Number(prod.price);
          if (item.price !== freshPrice) {
            hasAdjusted = true;
          }
          return {
            ...item,
            qty: newQty,
            price: freshPrice,
            image: varObj?.image || prod.image
          };
        }).filter(Boolean);
        if (hasAdjusted) {
          setCart(sanitized);
          showToast('Tu carrito fue actualizado con el stock y precios vigentes.', 'info');
        }
      }, [isCartOpen]);
      async function loadCloudCart(userId) {
        try {
          const {
            data
          } = await supabase.from('kaoj_carts').select('items').eq('user_id', userId).single();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            setCart(prevCart => {
              if (prevCart.length === 0) return data.items;
              const merged = [...data.items];
              prevCart.forEach(localItem => {
                const existing = merged.find(i => i.key === localItem.key);
                if (existing) {
                  existing.qty = Math.max(existing.qty, localItem.qty);
                } else {
                  merged.push(localItem);
                }
              });
              return merged;
            });
            showToast('Carrito sincronizado desde la nube');
          }
        } catch (err) {} finally {
          isCloudCartLoadedRef.current = true;
        }
      }

      // =======================================================================
      // 3. GESTIÓN DEL CARRITO Y CÁLCULOS (Envío Gratis & Puntos VIP)
      // =======================================================================
      function addToCart(product, specificVariant = null, openCart = false) {
        const activeInfo = activeVariants[product.id];
        const varName = specificVariant || activeInfo?.variantName || product.variants?.[0]?.name;
        const variantObj = (product.variants || []).find(v => v.name === varName);
        if (!variantObj || variantObj.stock <= 0) {
          return showToast(`"${varName}" no disponible actualmente.`, 'error');
        }
        const key = `${product.id}_${varName}`;
        const existing = cart.find(i => i.key === key);
        if (existing && existing.qty >= variantObj.stock) {
          return showToast(`Stock máximo disponible: ${variantObj.stock} unidades.`, 'info');
        }
        const unitPrice = product.discount_price ? Number(product.discount_price) : Number(product.price);
        const itemImage = variantObj.image || product.image;
        if (existing) {
          setCart(cart.map(i => i.key === key ? {
            ...i,
            qty: i.qty + 1
          } : i));
        } else {
          setCart([...cart, {
            key,
            productId: product.id,
            name: product.name,
            variant: varName,
            price: unitPrice,
            qty: 1,
            image: itemImage
          }]);
        }
        showToast(`"${product.name}" (${varName}) agregado al carrito ✨`);
        if (openCart) {
          setIsCartOpen(true);
          if (quickViewProduct) setQuickViewProduct(null);
        }
      }
      function updateCartQty(key, delta) {
        setCart(cart.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            const prod = products.find(p => p.id === item.productId);
            const varObj = prod?.variants?.find(v => v.name === item.variant);
            const maxStock = varObj ? varObj.stock : 99;
            if (newQty > maxStock) {
              showToast(`Stock máximo: ${maxStock}`, 'info');
              return item;
            }
            return newQty > 0 ? {
              ...item,
              qty: newQty
            } : null;
          }
          return item;
        }).filter(Boolean));
      }
      function removeFromCart(key) {
        setCart(cart.filter(i => i.key !== key));
      }

      // Cálculos Financieros
      const subtotal = cart.reduce((acc, i) => acc + i.price * i.qty, 0);

      // Métodos de Entrega Activos Normalizados en 4 Categorías (Retiro, Domicilio Manta/Portoviejo, Cooperativa, Servientrega)
      const activeDeliveryOptions = useMemo(() => {
        return normalizeShippingRates(settings.shipping_rates);
      }, [settings.shipping_rates]);
      const deliveryObj = useMemo(() => {
        const found = activeDeliveryOptions.find(d => d.id === customer.delivery);
        if (found) return found;
        const firstInCat = activeDeliveryOptions.find(d => getShippingCategory(d) === (customer.shippingCategory || 'retiro'));
        return firstInCat || activeDeliveryOptions[0] || DEFAULT_SHIPPING_RATES[0];
      }, [activeDeliveryOptions, customer.delivery, customer.shippingCategory]);
      const activeShippingCategory = getShippingCategory(deliveryObj);
      const categorySubMethods = useMemo(() => {
        return activeDeliveryOptions.filter(d => getShippingCategory(d) === activeShippingCategory);
      }, [activeDeliveryOptions, activeShippingCategory]);
      function handleSelectShippingCategory(catId) {
        const subOptions = activeDeliveryOptions.filter(d => getShippingCategory(d) === catId);
        const firstMethod = subOptions[0] || activeDeliveryOptions[0];
        setCustomer(prev => ({
          ...prev,
          shippingCategory: catId,
          delivery: firstMethod ? firstMethod.id : prev.delivery,
          city: catId === 'domicilio' ? firstMethod?.city || (firstMethod?.id?.includes('manta') ? 'Manta' : 'Portoviejo') : prev.city
        }));
      }

      // Regla de Envío Gratis
      const freeShippingThreshold = Number(settings.free_shipping_threshold || 50.00);
      const qualifiesFreeShipping = subtotal >= freeShippingThreshold && Number(deliveryObj?.price || 0) > 0;
      const finalShippingCost = qualifiesFreeShipping ? 0 : Number(deliveryObj?.price || 0);

      // Regla de Puntos VIP: Cada 50 puntos = $5.00 de descuento directo
      const customerCurrentPoints = Number(customerProfile?.points || 0);
      const pointsPerBlock = Number(settings.points_min_redeem || 50);
      const discountPerBlock = 5.00;
      const maxAvailablePointBlocks = Math.floor(customerCurrentPoints / pointsPerBlock);
      const maxSubtotalBlocks = Math.max(1, Math.floor(subtotal / discountPerBlock));
      const maxRedeemableBlocks = Math.min(maxAvailablePointBlocks, maxSubtotalBlocks);
      const canRedeemPoints = maxAvailablePointBlocks >= 1 && subtotal >= discountPerBlock;
      const activeRedeemBlocks = applyPointsDiscount && canRedeemPoints ? Math.min(Math.max(1, redeemBlocksCount), maxRedeemableBlocks) : 0;
      const pointsToRedeemNow = activeRedeemBlocks * pointsPerBlock;
      const pointsDiscountAmount = activeRedeemBlocks * discountPerBlock;

      // Progreso hacia el siguiente canje de 50 puntos ($5.00 OFF)
      const pointsTowardsNextBlock = customerCurrentPoints % pointsPerBlock;
      const pointsNeededForNextDiscount = pointsPerBlock - pointsTowardsNextBlock;
      const pointsProgressPercent = canRedeemPoints ? 100 : Math.min(100, Math.round(pointsTowardsNextBlock / pointsPerBlock * 100));

      // Descuento por Cupón Promocional
      let couponDiscountAmount = 0;
      if (appliedCoupon) {
        if (appliedCoupon.type === 'percent' || appliedCoupon.type === 'percentage') {
          const pct = Number(appliedCoupon.discount || appliedCoupon.value || 0);
          couponDiscountAmount = Number((subtotal * pct / 100).toFixed(2));
        } else if (appliedCoupon.type === 'fixed') {
          const fixVal = Number(appliedCoupon.discount || appliedCoupon.value || 0);
          couponDiscountAmount = Math.min(subtotal, fixVal);
        } else if (appliedCoupon.type === 'shipping') {
          couponDiscountAmount = finalShippingCost;
        }
      }

      // Descuentos aplicables al producto (no envío)
      const productDiscounts = Math.min(subtotal, pointsDiscountAmount + (appliedCoupon?.type !== 'shipping' ? couponDiscountAmount : 0));
      const totalDiscounts = pointsDiscountAmount + couponDiscountAmount;
      const finalShippingAfterCoupon = qualifiesFreeShipping || appliedCoupon?.type === 'shipping' ? 0 : Number(deliveryObj?.price || 0);
      const baseTotalBeforeCardFee = Math.max(0, subtotal - productDiscounts) + finalShippingAfterCoupon;

      // Recargo por pago con Tarjeta en Payphone (Comisión de pasarela con tarjeta)
      const payphoneSurchargePercent = Number(settings.payphone_surcharge_percent ?? 6.0);
      const payphoneSurchargeAmount = customer.paymentMethod === 'payphone' ? Number((baseTotalBeforeCardFee * payphoneSurchargePercent / 100).toFixed(2)) : 0;
      const total = Number((baseTotalBeforeCardFee + payphoneSurchargeAmount).toFixed(2));
      const pointsEarnedWithOrder = Math.floor(Math.max(0, subtotal - productDiscounts));

      // Métricas de Envío Gratis
      const remainingForFreeShipping = Math.max(0, freeShippingThreshold - subtotal);
      const shippingProgressPercent = Math.min(100, Math.round(subtotal / freeShippingThreshold * 100));

      // Código de cliente activo
      const activeCustomerCode = customerProfile?.customer_code || generateCustomerCode(customer.name, customer.phone);

      // Validación de navegación por pasos en el Checkout (1: Datos, 2: Envío, 3: Pago)
      function validateCheckoutStep1() {
        if (!customer.name || !customer.name.trim()) {
          showToast('Por favor ingresa tu nombre y apellido para continuar.', 'error');
          return false;
        }
        const cleanDigits = (customer.phone || '').replace(/\D/g, '');
        if (cleanDigits.length < 9) {
          showToast('Ingresa tu número de celular de WhatsApp (10 dígitos).', 'error');
          return false;
        }
        return true;
      }
      function validateCheckoutStep2() {
        if (!deliveryObj) {
          showToast('Selecciona un método de envío para continuar.', 'error');
          return false;
        }
        if (activeShippingCategory === 'domicilio') {
          if (!customer.address || !customer.address.trim()) {
            showToast('Ingresa tu dirección exacta y referencia en Manta o Portoviejo.', 'error');
            return false;
          }
        } else if (activeShippingCategory === 'cooperativa') {
          if (!customer.city || !customer.city.trim()) {
            showToast('Indica la ciudad de destino para tu envío por Cooperativa.', 'error');
            return false;
          }
          if (!customer.address || !customer.address.trim()) {
            showToast('Indica la cooperativa preferida o terminal de retiro.', 'error');
            return false;
          }
        } else if (activeShippingCategory === 'servientrega') {
          if (!customer.city || !customer.city.trim()) {
            showToast('Indica la ciudad y provincia de destino para Servientrega.', 'error');
            return false;
          }
          if (!customer.address || !customer.address.trim()) {
            showToast('Ingresa la dirección exacta o la agencia oficial de Servientrega.', 'error');
            return false;
          }
          if (!customer.idCard || customer.idCard.replace(/\D/g, '').length < 8) {
            showToast('Ingresa tu número de Cédula o RUC para generar tu guía oficial de Servientrega.', 'error');
            return false;
          }
        }
        return true;
      }
      function handleGoToStep(targetStep) {
        if (targetStep === 1) {
          setCheckoutStep(1);
          return;
        }
        if (targetStep === 2) {
          if (!validateCheckoutStep1()) return;
          handlePhoneLookup(customer.phone);
          setShowCartItemsInStep(false);
          setCheckoutStep(2);
          return;
        }
        if (targetStep === 3) {
          if (!validateCheckoutStep1()) {
            setCheckoutStep(1);
            return;
          }
          if (!validateCheckoutStep2()) {
            setCheckoutStep(2);
            return;
          }
          setShowCartItemsInStep(false);
          setCheckoutStep(3);
        }
      }

      // =======================================================================
      // 4. CHECKOUT SEGURO & DESCUENTO ATÓMICO DE STOCK (FASE 1)
      // =======================================================================
      async function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) return showToast('El carrito está vacío', 'error');
        if (!validateCheckoutStep1()) {
          setCheckoutStep(1);
          return;
        }
        if (!validateCheckoutStep2()) {
          setCheckoutStep(2);
          return;
        }

        // Validación de pago en Paso 3
        if (customer.paymentMethod === 'payphone') {
          if (!customer.payphoneRef.trim() && !customer.receiptUrl) {
            return showToast('Ingresa el número de referencia/autorización o sube la captura de tu pago en Payphone.', 'error');
          }
        } else if (customer.paymentMethod === 'deuna') {
          const cleanTx = (customer.receiptRef || '').replace(/\D/g, '');
          if (!cleanTx) {
            return showToast('Ingresa el número de transacción de 12 dígitos de tu pago en Deuna!.', 'error');
          }
          if (customer.deunaVerified !== true) {
            return showToast('❌ Tu pago con Deuna! aún no ha sido verificado. Ingresa los 12 dígitos de tu transacción y pulsa en "Verificar" para validar la compra.', 'error');
          }
        } else if (!customer.receiptUrl) {
          return showToast('Sube la captura del comprobante de transferencia bancaria para validar tu pedido.', 'error');
        }
        setIsSubmittingOrder(true);

        // 1. VERIFICACIÓN DE STOCK EN TIEMPO REAL DESDE SUPABASE
        const prodIds = [...new Set(cart.map(i => i.productId))];
        const {
          data: freshProducts,
          error: fetchErr
        } = await supabase.from('kaoj_products').select('id, name, variants, is_active').in('id', prodIds);
        if (fetchErr || !freshProducts) {
          setIsSubmittingOrder(false);
          return showToast('No se pudo verificar el inventario en tiempo real. Intenta de nuevo.', 'error');
        }

        // Validar cantidades de cada ítem del carrito contra el stock fresco
        for (const item of cart) {
          const freshProd = freshProducts.find(p => p.id === item.productId);
          if (!freshProd || !freshProd.is_active) {
            setIsSubmittingOrder(false);
            return showToast(`El producto "${item.name}" ya no se encuentra disponible.`, 'error');
          }
          const varObj = (freshProd.variants || []).find(v => v.name === item.variant);
          const stockAvail = varObj ? Number(varObj.stock || 0) : 0;
          if (stockAvail < item.qty) {
            setIsSubmittingOrder(false);
            if (stockAvail <= 0) {
              return showToast(`Lo sentimos, "${item.name} (${item.variant})" se ha agotado. Por favor retíralo de tu pedido.`, 'error');
            } else {
              return showToast(`Solo quedan ${stockAvail} unidad(es) de "${item.name} (${item.variant})". Ajusta tu carrito.`, 'error');
            }
          }
        }
        const orderCode = `KAOJ-${Math.floor(100000 + Math.random() * 900000)}`;
        const formattedFullAddress = [customer.city ? `Ciudad: ${customer.city.trim()}` : '', customer.address ? customer.address.trim() : '', customer.deliveryNotes ? `Nota: ${customer.deliveryNotes.trim()}` : ''].filter(Boolean).join(' | ');
        const adminNotesParts = [];
        if (customer.receiptRef && customer.receiptRef.trim()) adminNotesParts.push(`Comprobante #: ${customer.receiptRef.trim()}`);
        if (appliedCoupon) adminNotesParts.push(`Cupón: ${appliedCoupon.code} (-$${couponDiscountAmount.toFixed(2)})`);
        if (pointsToRedeemNow > 0) adminNotesParts.push(`Canje VIP: ${pointsToRedeemNow} pts (-$${pointsDiscountAmount.toFixed(2)})`);
        if (payphoneSurchargeAmount > 0) adminNotesParts.push(`Recargo Tarjeta Payphone (${payphoneSurchargePercent}%): +$${payphoneSurchargeAmount.toFixed(2)}`);

        // Verificación anti-fraude y anti-duplicados de comprobante Banco Pichincha / DeUna
        if (customer.receiptQrData?.isDuplicate) {
          setIsSubmittingOrder(false);
          return showToast(`Este comprobante ya fue utilizado en el pedido #${customer.receiptQrData.duplicateOrder}. Debes realizar una transferencia nueva.`, 'error');
        }

        // Doble comprobación en tiempo real en la base de datos
        if (customer.receiptRef && customer.receiptRef.trim()) {
          try {
            const {
              data: serverCheck
            } = await supabase.rpc('kaoj_check_receipt_duplicate', {
              check_ref: customer.receiptRef.trim(),
              check_uuid: customer.receiptQrData?.uuid || '',
              check_hash: customer.receiptQrData?.hash || ''
            });
            if (serverCheck && serverCheck.is_duplicate) {
              setIsSubmittingOrder(false);
              return showToast(`Este comprobante ya fue utilizado en el pedido #${serverCheck.existing_order_code}. No se permiten comprobantes duplicados.`, 'error');
            }
          } catch (_) {}
        }
        let initialStatus = 'pendiente';
        if (customer.receiptQrData && !customer.receiptQrData.isDuplicate) {
          const qr = customer.receiptQrData;
          adminNotesParts.push(`[QR PICHINCHA VERIFICADO: $${Number(qr.amount).toFixed(2)} | Emisor: ${qr.senderName} | Ref: ${qr.secuencial || qr.uuid} | Dest: ${qr.receiverName} (${qr.receiverAcc})]`);
          const receiverMatches = qr.receiverAcc && qr.receiverAcc.includes('7440') || qr.receiverName && qr.receiverName.toUpperCase().includes('DEMERA') || settings.bank_pichincha_acc && qr.receiverAcc && qr.receiverAcc.includes(settings.bank_pichincha_acc.slice(-4));
          const amountMatches = qr.amount >= total - 0.05;
          if (receiverMatches && amountMatches) {
            initialStatus = 'verificado';
          }
        }

        // Verificación de DeUna! automática al confirmar
        if (customer.paymentMethod === 'deuna') {
          if (customer.deunaVerified === true && customer.deunaData) {
            initialStatus = 'verificado';
            adminNotesParts.push(`[DEUNA AUTO-VERIFICADO: $${Number(customer.deunaData.amount || total).toFixed(2)} | Tx: ${customer.receiptRef || customer.deunaData.transaction_id} | Emisor: ${customer.deunaData.sender_name || 'Confirmado'}]`);
          } else if (customer.receiptRef) {
            adminNotesParts.push(`[Tx DeUna: ${customer.receiptRef.trim()}]`);
          }
        }
        const orderData = {
          order_code: orderCode,
          customer_code: activeCustomerCode,
          customer_name: customer.name.trim(),
          customer_phone: customer.phone.trim(),
          customer_id_card: customer.idCard.trim(),
          customer_email: customer.email || user?.email || '',
          user_id: user?.id || null,
          delivery_method: deliveryObj.label + (qualifiesFreeShipping ? ' (Envío Gratis)' : ''),
          delivery_address: formattedFullAddress || 'Retiro Personal',
          shipping_cost: finalShippingAfterCoupon,
          subtotal: subtotal,
          discount_amount: productDiscounts,
          total: total,
          points_earned: pointsEarnedWithOrder,
          points_redeemed: pointsToRedeemNow,
          payment_method: customer.paymentMethod === 'deuna' ? `Deuna!${customer.receiptRef ? ` (Comp: ${customer.receiptRef.trim()})` : ''}` : customer.paymentMethod === 'payphone' ? `Tarjeta Payphone (Ref: ${customer.payphoneRef || 'Comprobante'} | +$${payphoneSurchargeAmount.toFixed(2)} recargo)` : `Transferencia Bancaria (${selectedTransferBank === 'pichincha' ? 'Banco Pichincha' : 'Banco Guayaquil'}${customer.receiptRef ? ` • Comp: ${customer.receiptRef.trim()}` : ''})`,
          receipt_url: customer.receiptUrl || (customer.paymentMethod === 'deuna' ? `Deuna! Tx: ${(customer.receiptRef || '').trim()}` : `Payphone Ref: ${customer.payphoneRef}`),
          items: cart,
          status: initialStatus,
          admin_notes: adminNotesParts.join(' • ')
        };
        try {
          // 2. Insertar orden con control estricto de error
          const {
            error: orderError
          } = await supabase.from('kaoj_orders').insert([orderData]);
          if (orderError) {
            console.error('Error registrando orden en Supabase:', orderError);
            setIsSubmittingOrder(false);
            return showToast('Error al registrar tu orden: ' + (orderError.message || 'Verifica tu conexión'), 'error');
          }

          // 3. Descuento seguro de stock atómico en el servidor (Sin permisos UPDATE a clientes)
          await supabase.rpc('kaoj_decrement_order_stock', {
            order_items: cart
          });

          // Si pagó con DeUna y tiene N° de transacción, conciliar en kaoj_deuna_payments
          if (customer.paymentMethod === 'deuna' && customer.receiptRef) {
            try {
              await supabase.rpc('kaoj_verify_deuna_payment', {
                p_tx_id: customer.receiptRef.replace(/\D/g, ''),
                p_expected_amount: total,
                p_order_code: orderCode
              });
            } catch (errDeuna) {
              console.warn('Conciliación diferida DeUna:', errDeuna);
            }
          }

          // 4. Actualizar puntos del cliente en kaoj_customers de forma atómica y sin colisiones
          const {
            data: custRes
          } = await supabase.rpc('kaoj_save_customer_order', {
            cust_code: activeCustomerCode,
            cust_name: customer.name.trim(),
            cust_phone: customer.phone.trim(),
            cust_email: customer.email || user?.email || '',
            cust_id_card: customer.idCard.trim(),
            cust_address: formattedFullAddress,
            cust_user_id: user?.id || null,
            points_to_add: pointsEarnedWithOrder,
            points_to_deduct: pointsToRedeemNow,
            order_total: total
          });
          if (customerProfile && custRes?.points !== undefined) {
            setCustomerProfile(prev => ({
              ...prev,
              points: custRes.points
            }));
          } else {
            const updatedPts = Math.max(0, customerCurrentPoints - pointsToRedeemNow) + pointsEarnedWithOrder;
            setCustomerProfile(prev => ({
              ...(prev || {}),
              customer_code: activeCustomerCode,
              name: customer.name.trim(),
              phone: customer.phone.trim(),
              points: updatedPts
            }));
          }
          if (user) {
            await supabase.from('kaoj_carts').delete().eq('user_id', user.id);
          }
        } catch (err) {
          console.error('Error inesperado durante la compra:', err);
          setIsSubmittingOrder(false);
          return showToast('Ocurrió un error al procesar la compra: ' + err.message, 'error');
        }

        // 5. Generar enlace y mensaje pre-formateado a WhatsApp Oficial
        const officialWhatsApp = formatWhatsAppPhone(settings.whatsapp_number);
        const itemsListText = cart.map(i => `• ${i.qty}x *${i.name}* (${i.variant}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');
        const paymentLabel = customer.paymentMethod === 'deuna' ? 'Deuna! (Sin recargo)' : customer.paymentMethod === 'payphone' ? `Tarjeta / Payphone (Ref: ${customer.payphoneRef || 'Adjunto'})` : `Transferencia Bancaria (${selectedTransferBank === 'pichincha' ? 'Banco Pichincha' : 'Banco Guayaquil'})`;
        const whatsappMsg = `*NUEVO PEDIDO KAOJ STORE*\n\n` + `*Orden:* ${orderCode}\n` + `*Código VIP Cliente:* *${activeCustomerCode}*\n` + `*Cliente:* ${customer.name}\n` + `*Celular:* ${customer.phone}\n` + (customer.idCard ? `*Cédula/RUC:* ${customer.idCard}\n` : '') + `*Modalidad de Envío:* ${deliveryObj.label}\n` + (formattedFullAddress ? `*Destino / Dirección:* ${formattedFullAddress}\n` : '') + `*Forma de Pago:* ${paymentLabel}\n\n` + `*PRODUCTOS COMPRADOS:*\n${itemsListText}\n\n` + `*Subtotal:* $${subtotal.toFixed(2)}\n` + (pointsDiscountAmount > 0 ? `*Descuento Puntos VIP (${pointsToRedeemNow} Pts):* -$${pointsDiscountAmount.toFixed(2)}\n` : '') + (couponDiscountAmount > 0 ? `*Cupón (${appliedCoupon.code}):* -$${couponDiscountAmount.toFixed(2)}\n` : '') + `*Envío:* ${finalShippingAfterCoupon === 0 ? 'GRATIS ($0.00)' : '$' + finalShippingAfterCoupon.toFixed(2)}\n` + (payphoneSurchargeAmount > 0 ? `*Recargo Tarjeta Payphone (${payphoneSurchargePercent}%):* +$${payphoneSurchargeAmount.toFixed(2)}\n` : '') + `*TOTAL PAGADO:* *$${total.toFixed(2)}*\n` + (customer.receiptRef ? `*N° Comprobante Bancario:* ${customer.receiptRef.trim()}\n` : '') + `*Puntos Kaoj Ganados:* +${pointsEarnedWithOrder} pts (Cada 50 pts = $5.00 OFF)\n\n` + (customer.receiptUrl ? `*Comprobante:* \n${customer.receiptUrl}\n\n` : '') + `Hola Kaoj Store, acabo de realizar mi pedido en la tienda online.`;
        const whatsappUrl = `https://wa.me/${officialWhatsApp}?text=${encodeURIComponent(whatsappMsg)}`;

        // 6. Activar el Modal de Confirmación de Pedido (Resistente a bloqueadores móviles)
        setOrderSuccessModal({
          orderCode,
          order_code: orderCode,
          customerCode: activeCustomerCode,
          customer_code: activeCustomerCode,
          customerName: customer.name.trim(),
          customer_name: customer.name.trim(),
          customerPhone: customer.phone.trim(),
          customer_phone: customer.phone.trim(),
          customerIdCard: customer.idCard.trim(),
          customer_id_card: customer.idCard.trim(),
          deliveryAddress: formattedFullAddress || 'Retiro Personal',
          delivery_address: formattedFullAddress || 'Retiro Personal',
          deliveryMethod: deliveryObj.label,
          delivery_method: deliveryObj.label,
          paymentMethod: orderData.payment_method,
          payment_method: orderData.payment_method,
          total: total.toFixed(2),
          subtotal: subtotal.toFixed(2),
          shippingCost: finalShippingAfterCoupon,
          shipping_cost: finalShippingAfterCoupon,
          discountAmount: productDiscounts,
          discount_amount: productDiscounts,
          payphoneSurcharge: payphoneSurchargeAmount,
          pointsEarned: pointsEarnedWithOrder,
          points_earned: pointsEarnedWithOrder,
          pointsRedeemed: pointsToRedeemNow,
          whatsappUrl,
          items: [...cart],
          created_at: new Date().toISOString()
        });

        // Intentar apertura automática de WhatsApp en pestaña nueva
        try {
          window.open(whatsappUrl, '_blank');
        } catch (e) {}

        // Persistir último código y teléfono para auto-rastreo sin login manual
        try {
          localStorage.setItem('kaoj_last_customer_code', activeCustomerCode);
          if (customer.phone) localStorage.setItem('kaoj_last_customer_phone', customer.phone);
        } catch (e) {}

        // Limpiar carrito y reiniciar al Paso 1
        setCart([]);
        localStorage.removeItem('kaoj_cart');
        setIsCartOpen(false);
        setCheckoutStep(1);
        setShowCartItemsInStep(true);
        setApplyPointsDiscount(false);
        setRedeemBlocksCount(1);
        setAppliedCoupon(null);
        setCouponCodeInput('');
        setShowCouponInputBox(false);
        setCustomer(prev => ({
          ...prev,
          receiptUrl: '',
          receiptRef: '',
          receiptQrData: null,
          payphoneRef: ''
        }));
        setIsSubmittingOrder(false);
        showToast(`¡Pedido ${orderCode} generado con éxito! Ganaste +${pointsEarnedWithOrder} Puntos Kaoj VIP.`);
        fetchInitialData();
      }

      // =======================================================================
      // 5. GESTIÓN DE RESEÑAS (Social Proof)
      // =======================================================================
      async function handleCreateReview(e) {
        e.preventDefault();
        if (!newReview.customer_name.trim() || !newReview.comment.trim()) {
          return showToast('Por favor ingresa tu nombre y opinión.', 'error');
        }
        if (newReview.order_code && Array.isArray(trackedOrders)) {
          const linkedOrder = trackedOrders.find(o => o.order_code === newReview.order_code);
          if (linkedOrder && linkedOrder.status === 'cancelado') {
            setIsReviewModalOpen(false);
            return showToast('No se pueden calificar productos de un pedido cancelado.', 'error');
          }
        }
        const reviewPayload = {
          customer_name: newReview.customer_name.trim(),
          customer_code: newReview.customer_code.trim() || activeCustomerCode || '',
          product_id: newReview.product_id ? Number(newReview.product_id) : null,
          product_name: newReview.product_name || 'Boutique Kaoj',
          rating: Number(newReview.rating) || 5,
          comment: newReview.comment.trim(),
          photo_url: newReview.photo_url || '',
          is_verified_buyer: Boolean(newReview.order_code),
          is_approved: false
        };
        const {
          error
        } = await supabase.from('kaoj_reviews').insert([reviewPayload]);
        if (error) return showToast('Error al enviar reseña: ' + error.message, 'error');
        setIsReviewModalOpen(false);
        setNewReview({
          customer_name: '',
          customer_code: '',
          product_id: '',
          product_name: '',
          product_image: '',
          product_variant: '',
          order_code: '',
          rating: 5,
          comment: '',
          photo_url: ''
        });
        showToast('¡Gracias por tu reseña! Ha sido enviada y será publicada en el muro tras su aprobación. ✨');
      }
      async function handleDeleteReview(reviewId) {
        if (!confirm('¿Eliminar esta reseña definitivamente?')) return;
        const adminPin = sessionStorage.getItem('kaoj_admin_pin') || '';
        const {
          error
        } = await supabase.rpc('kaoj_admin_delete_review', {
          admin_pin: adminPin,
          rev_id: reviewId
        });
        if (!error) {
          setReviews(reviews.filter(r => r.id !== reviewId));
          showToast('Reseña eliminada');
        } else {
          showToast('Error al eliminar: ' + error.message, 'error');
        }
      }
      async function handleToggleReviewApproval(reviewId, currentStatus) {
        const nextStatus = !currentStatus;
        const adminPin = sessionStorage.getItem('kaoj_admin_pin') || '';
        const {
          error
        } = await supabase.rpc('kaoj_admin_moderate_review', {
          admin_pin: adminPin,
          rev_id: reviewId,
          approve: nextStatus
        });
        if (!error) {
          setReviews(reviews.map(r => r.id === reviewId ? {
            ...r,
            is_approved: nextStatus
          } : r));
          showToast(`Reseña ${nextStatus ? 'aprobada' : 'ocultada'}`);
        } else {
          showToast('Error al moderar: ' + error.message, 'error');
        }
      }

      // =======================================================================
      // CANCELAR O REVERTIR VENTA (Solo Administrador: Restaura existencias y ajusta saldo)
      // =======================================================================
      async function handleCancelOrder(order) {
        if (!order || order.status === 'cancelado') {
          return showToast('Esta orden ya se encuentra cancelada.', 'error');
        }
        const itemsCount = (order.items || []).reduce((acc, i) => acc + (Number(i.qty) || 0), 0);
        const isVerified = order.status === 'verificado';
        const confirmMsg = `¿Deseas cancelar y revertir la venta de la orden #${order.order_code}${isVerified ? ' (Pago Verificado)' : ''}?\n\n` + `• Se devolverán ${itemsCount} producto(s) a las existencias del inventario.\n` + `• El estado de la orden pasará a CANCELADO.\n` + `• Si la compra acumuló puntos VIP, se descontarán del saldo de la clienta.` + (order.payment_method?.toLowerCase().includes('deuna') ? '\n• Si pagó con Deuna!, la transacción se liberará para poder reutilizarla en pruebas.' : '');
        if (!window.confirm(confirmMsg)) return;
        setUploading(true);
        try {
          const adminPin = sessionStorage.getItem('kaoj_admin_pin') || localStorage.getItem('kaoj_admin_pin') || '';
          let restoredItems = 0;
          let rpcSuccess = false;
          try {
            const {
              data: cancelRes,
              error: rpcErr
            } = await supabase.rpc('kaoj_admin_cancel_order', {
              admin_pin: adminPin,
              target_order_id: order.id
            });
            if (!rpcErr && cancelRes?.success) {
              rpcSuccess = true;
              restoredItems = cancelRes?.restored_items || itemsCount;
            }
          } catch (e) {
            console.warn('RPC kaoj_admin_cancel_order error, running safe fallback:', e);
          }

          // Fallback seguro si la RPC falló o no está instalada: restaurar stock y marcar cancelado directamente
          if (!rpcSuccess) {
            const cancelNote = `[VENTA REVERTIDA: Stock devuelto (${new Date().toLocaleDateString('es-EC')})]`;
            const updatedNotes = order.admin_notes ? `${order.admin_notes} | ${cancelNote}` : cancelNote;
            await supabase.from('kaoj_orders').update({
              status: 'cancelado',
              admin_notes: updatedNotes,
              updated_at: new Date().toISOString()
            }).eq('id', order.id);

            // Devolver existencias a los productos y sus variantes
            for (const item of order.items || []) {
              if (item.productId) {
                try {
                  const {
                    data: prodData
                  } = await supabase.from('kaoj_products').select('variants').eq('id', item.productId).single();
                  if (prodData && prodData.variants) {
                    const updatedVars = prodData.variants.map(v => {
                      if (v.name === item.variant) {
                        return {
                          ...v,
                          stock: Number(v.stock || 0) + Number(item.qty || 1)
                        };
                      }
                      return v;
                    });
                    await supabase.from('kaoj_products').update({
                      variants: updatedVars
                    }).eq('id', item.productId);
                  }
                } catch (_) {}
              }
            }
            restoredItems = itemsCount;
          }

          // Liberar el pago DeUna conciliado para poder reusarlo en pruebas
          try {
            await supabase.from('kaoj_deuna_payments').update({
              status: 'disponible',
              matched_order_code: null,
              matched_at: null
            }).eq('matched_order_code', order.order_code);
          } catch (_) {}
          const cancelNote = `[VENTA REVERTIDA / CANCELADA: Stock devuelto (${new Date().toLocaleDateString('es-EC')})]`;
          const updatedNotes = order.admin_notes ? `${order.admin_notes} | ${cancelNote}` : cancelNote;
          setOrders(orders.map(o => o.id === order.id ? {
            ...o,
            status: 'cancelado',
            admin_notes: updatedNotes
          } : o));
          setUploading(false);
          showToast(`¡Venta #${order.order_code} cancelada exitosamente! Se devolvieron ${restoredItems} producto(s) al inventario.`, 'success');
          fetchInitialData();
        } catch (err) {
          setUploading(false);
          console.error('Error al revertir orden:', err);
          showToast('Error al revertir la venta: ' + err.message, 'error');
        }
      }

      // =======================================================================
      // ELIMINAR PEDIDO CANCELADO (Solo Administrador: Borrado permanente)
      // =======================================================================
      async function handleDeleteOrder(order) {
        if (!order || !order.id) return;
        if (order.status !== 'cancelado') {
          return showToast('Solo se pueden eliminar pedidos que ya se encuentren en estado Cancelado.', 'error');
        }
        const confirmMsg = `¿Deseas eliminar permanentemente el pedido cancelado #${order.order_code} de ${order.customer_name}?\n\n` + `• Esta acción borrará el pedido de la base de datos de manera definitiva.\n` + `• Ya no aparecerá en tus listas ni reportes.`;
        if (!window.confirm(confirmMsg)) return;
        setUploading(true);
        try {
          const adminPin = sessionStorage.getItem('kaoj_admin_pin') || localStorage.getItem('kaoj_admin_pin') || '';

          // 1. Registrar inmediatamente en lista negra local para evitar que reaparezca en este navegador al refrescar
          try {
            const savedDeleted = JSON.parse(localStorage.getItem('kaoj_deleted_order_ids') || '[]');
            if (!savedDeleted.includes(order.id)) {
              savedDeleted.push(order.id);
              localStorage.setItem('kaoj_deleted_order_ids', JSON.stringify(savedDeleted));
            }
          } catch (_) {}

          // 2. Intentar borrado físico vía RPC
          let deletedInDb = false;
          try {
            const {
              error: rpcErr
            } = await supabase.rpc('kaoj_admin_delete_order', {
              admin_pin: adminPin,
              target_order_id: order.id
            });
            if (!rpcErr) deletedInDb = true;
          } catch (_) {}

          // 3. Si kaoj_admin_delete_order no existe aún en el dashboard de Supabase, marcar como 'eliminado'
          if (!deletedInDb) {
            try {
              await supabase.rpc('kaoj_admin_update_order_status', {
                admin_pin: adminPin,
                target_order_id: order.id,
                new_status: 'eliminado'
              });
            } catch (_) {}
            try {
              await supabase.from('kaoj_orders').delete().eq('id', order.id);
            } catch (_) {}
          }
          setOrders(prev => prev.filter(o => o.id !== order.id));
          setSelectedOrderIds(prev => prev.filter(id => id !== order.id));
          setUploading(false);
          showToast(`Pedido cancelado #${order.order_code} eliminado permanentemente.`, 'success');
        } catch (err) {
          setUploading(false);
          console.error('Error al eliminar orden cancelada:', err);
          showToast('Error al eliminar el pedido: ' + err.message, 'error');
        }
      }

      // =======================================================================
      // 6. SUBIDA DE ARCHIVOS A SUPABASE STORAGE (FOTOS Y VIDEOS)
      // =======================================================================
      async function uploadFileToSupabase(file, folder = 'products') {
        if (!file) return null;
        const isVideo = file.type && file.type.startsWith('video/') || folder === 'videos' || /\.(mp4|webm|mov|ogg|m4v)$/i.test(file.name);
        const maxSize = isVideo ? 50 * 1024 * 1024 : 5 * 1024 * 1024;
        if (file.size > maxSize) {
          showToast(`El archivo supera el tamaño máximo permitido (${isVideo ? '50 MB' : '5 MB'}).`, 'error');
          return null;
        }
        const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/svg+xml', 'application/pdf', 'video/mp4', 'video/webm', 'video/quicktime', 'video/ogg', 'video/x-m4v'];
        if (!validTypes.includes(file.type) && !isVideo) {
          showToast('Formato no permitido. Se aceptan fotos (JPG, PNG, WebP), videos (MP4, MOV, WebM) o PDF.', 'error');
          return null;
        }
        setUploading(true);
        try {
          const ext = (file.name.split('.').pop() || (isVideo ? 'mp4' : 'jpg')).toLowerCase();
          const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
          const fileName = `${folder}/${Date.now()}_${cleanName}.${ext}`;
          const {
            error: uploadError
          } = await supabase.storage.from('kaoj-assets').upload(fileName, file, {
            cacheControl: '3600',
            upsert: true
          });
          if (uploadError) {
            if (isVideo && (uploadError.message?.toLowerCase().includes('policy') || uploadError.message?.toLowerCase().includes('row-level') || uploadError.message?.toLowerCase().includes('security'))) {
