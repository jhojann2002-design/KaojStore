    function calculateCustomerCode(name, phone) {
      if (!name || !phone) return '';
      const cleanName = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const match = cleanName.match(/[a-zA-Z]/);
      const firstLetter = match ? match[0].toUpperCase() : 'K';
      const digits = phone.replace(/\D/g, '');
      if (digits.length < 4) return '';
      const last4 = digits.slice(-4);
      return `${firstLetter}${last4}`;
    }

      async function fetchStoreData() {
        if (!supabase) return;
        try {
          const { data: prods } = await supabase.from('kaoj_products').select('*').eq('is_active', true).order('id', { ascending: false });
          if (prods && prods.length > 0) {
            setProducts(prods);
            const initVars = {};
            prods.forEach(p => {
              const firstAvail = (p.variants || []).find(v => v.stock > 0) || (p.variants || [])[0];
              if (firstAvail) initVars[p.id] = firstAvail.name;
            });
            setSelectedVariants(initVars);
          }

          const { data: cfg } = await supabase.from('kaoj_settings').select('*').eq('id', 1).single();
          if (cfg) {
            setSettings(prev => ({ ...prev, ...cfg }));
            if (cfg.sections_config && Object.keys(cfg.sections_config).length > 0) {
              setSectionsConfig(cfg.sections_config);
              localStorage.setItem('kaoj_sections_config', JSON.stringify(cfg.sections_config));
            }
          }

          const { data: ords } = await supabase.from('kaoj_orders').select('*').order('created_at', { ascending: false });
          if (ords) setOrders(ords);

          const { data: revs } = await supabase.from('kaoj_reviews').select('*').eq('is_approved', true).order('created_at', { ascending: false });
          if (revs && revs.length > 0) setReviews(revs);
        } catch (err) {}
      }

      async function syncCartFromCloud(userId) {
        if (!supabase) return;
        try {
          const { data } = await supabase.from('kaoj_carts').select('items').eq('user_id', userId).single();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            setCart(prevCart => {
              if (prevCart.length === 0) return data.items;
              const merged = [...data.items];
              prevCart.forEach(localItem => {
                const existing = merged.find(i => i.key === localItem.key);
                if (existing) {
                  existing.qty = Math.max(existing.qty, localItem.qty);
                } else {
                  merged.push(localItem);
                }
              });
              return merged;
            });
            showToast('☁️ Carrito sincronizado con tu cuenta Google');
          }
        } catch (err) {}
      }

      // =======================================================================
      // FILTRADO DE PRODUCTOS (JERARQUÍA: SECCIÓN -> SUBSECCIÓN -> BÚSQUEDA)
      // =======================================================================
      const filteredProducts = useMemo(() => {
        let result = [...products];

        // 1. Filtrado por Sección Grande
        if (selectedSection !== 'TODOS') {
          if (selectedSection === 'OFERTAS') {
            result = result.filter(p => Boolean(p.discount_price));
          } else {
            result = result.filter(p => (p.section || '').toUpperCase() === selectedSection);
          }
        }

        // 2. Filtrado por Subsección
        if (selectedSubcategory !== 'TODOS' && selectedSection !== 'OFERTAS') {
          result = result.filter(p => (p.category || '').toLowerCase() === selectedSubcategory.toLowerCase());
        }

        // 3. Filtrado por Texto de Búsqueda
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          result = result.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.description?.toLowerCase().includes(q) ||
            p.category?.toLowerCase().includes(q) ||
            p.section?.toLowerCase().includes(q)
          );
        }

        // 4. Ordenamiento
        if (sortBy === 'precio_menor') {
          result.sort((a, b) => (a.discount_price || a.price) - (b.discount_price || b.price));
        } else if (sortBy === 'precio_mayor') {
          result.sort((a, b) => (b.discount_price || b.price) - (a.discount_price || a.price));
        } else if (sortBy === 'ofertas') {
          result.sort((a, b) => (b.discount_price ? 1 : 0) - (a.discount_price ? 1 : 0));
        }

        return result;
      }, [products, selectedSection, selectedSubcategory, searchQuery, sortBy]);

      // =======================================================================
      // CARRITO Y CHECKOUT
      // =======================================================================
      function addToCart(product, specificVariant = null) {
        const varName = specificVariant || selectedVariants[product.id] || (product.variants?.[0]?.name);
        const variantObj = (product.variants || []).find(v => v.name === varName);

        if (!variantObj || variantObj.stock <= 0) {
          return showToast(`"${varName}" está agotado.`, 'error');
        }

        const key = `${product.id}_${varName}`;
        const existing = cart.find(i => i.key === key);

        if (existing && existing.qty >= variantObj.stock) {
          return showToast(`Máximo disponible: ${variantObj.stock} unidades.`, 'error');
        }

        const unitPrice = product.discount_price ? Number(product.discount_price) : Number(product.price);

        if (existing) {
          setCart(cart.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, {
            key,
            productId: product.id,
            name: product.name,
            variant: varName,
            price: unitPrice,
            qty: 1,
            image: product.image
          }]);
        }

        showToast(`✨ ¡"${product.name}" agregado!`);
        setIsCartOpen(true);
        if (quickViewProduct) setQuickViewProduct(null);
      }

      function updateCartQty(key, delta) {
        setCart(cart.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            const prod = products.find(p => p.id === item.productId);
            const varObj = prod?.variants?.find(v => v.name === item.variant);
            const maxStock = varObj ? varObj.stock : 99;

            if (newQty > maxStock) {
              showToast(`Stock máximo: ${maxStock}`, 'info');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      }

      function removeFromCart(key) {
        setCart(cart.filter(i => i.key !== key));
        showToast('Producto retirado del carrito', 'info');
      }

      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const deliveryObj = DELIVERY_OPTIONS.find(d => d.id === customer.delivery) || DELIVERY_OPTIONS[0];

      const pointsDiscountValue = (settings.points_min_redeem || 50) / (settings.points_redeem_ratio || 10);
      const canRedeemPoints = customerPoints >= (settings.points_min_redeem || 50);
      const discountApplied = (applyPointsDiscount && canRedeemPoints) ? pointsDiscountValue : 0;

      const total = Math.max(0, subtotal + deliveryObj.price - discountApplied);
      const pointsEarnedWithOrder = Math.floor(Math.max(0, subtotal - discountApplied));

      async function uploadFileToSupabase(file, folder = 'receipts') {
        if (!supabase) {
          showToast('Conecta Supabase primero para subir imágenes.', 'error');
          return null;
        }
        setUploading(true);
        try {
          const ext = file.name.split('.').pop();
          const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
          const fileName = `${folder}/${Date.now()}_${cleanName}.${ext}`;

          const { error: uploadError } = await supabase.storage
            .from('kaoj-assets')
            .upload(fileName, file, { cacheControl: '3600', upsert: true });

          if (uploadError) throw uploadError;

          const { data } = supabase.storage.from('kaoj-assets').getPublicUrl(fileName);
          setUploading(false);
          showToast('📸 Imagen subida');
          return data.publicUrl;
        } catch (err) {
          setUploading(false);
          showToast('Error: ' + err.message, 'error');
          return null;
        }
      }

      async function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) return showToast('El carrito está vacío', 'error');
        if (!customer.name.trim() || !customer.phone.trim()) {
          return showToast('Ingresa tu nombre y celular para generar tu código.', 'error');
        }

        if (customer.paymentMethod !== 'payphone' && !customer.receiptUrl) {
          return showToast('⚠️ Sube la captura de tu pago para asegurar tus productos.', 'error');
        }

        const generatedCode = customerCode || calculateCustomerCode(customer.name, customer.phone);
        const orderCode = `KAOJ-${Math.floor(100000 + Math.random() * 900000)}`;

        const orderData = {
          order_code: orderCode,
          customer_code: generatedCode,
          customer_name: customer.name.trim(),
          customer_phone: customer.phone.trim(),
          customer_id_card: customer.idCard.trim(),
          customer_email: customer.email || user?.email || '',
          user_id: user?.id || null,
          delivery_method: deliveryObj.label,
          delivery_address: customer.address.trim(),
          shipping_cost: deliveryObj.price,
          subtotal: subtotal,
          discount_amount: discountApplied,
          total: total,
          points_earned: pointsEarnedWithOrder,
          points_redeemed: applyPointsDiscount ? (settings.points_min_redeem || 50) : 0,
          payment_method:
            customer.paymentMethod === 'deuna' ? 'Deuna!' :
            customer.paymentMethod === 'payphone' ? 'Payphone (Tarjeta)' : 'Transferencia Bancaria',
          receipt_url: customer.receiptUrl || (customer.payphoneRef ? `Payphone Ref: ${customer.payphoneRef}` : ''),
          items: cart,
          status: 'pendiente'
        };

        if (supabase) {
          try {
            await supabase.from('kaoj_orders').insert([orderData]);

            for (const item of cart) {
              const prod = products.find(p => p.id === item.productId);
              if (prod && Array.isArray(prod.variants)) {
                const updatedVariants = prod.variants.map(v =>
                  v.name === item.variant ? { ...v, stock: Math.max(0, v.stock - item.qty) } : v
                );
                await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', prod.id);
              }
            }

            const newPointBalance = Math.max(0, customerPoints - (applyPointsDiscount ? 50 : 0)) + pointsEarnedWithOrder;
            setCustomerPoints(newPointBalance);
            localStorage.setItem('kaoj_cust_points', newPointBalance.toString());

            await supabase.from('kaoj_customers').upsert({
              customer_code: generatedCode,
              name: customer.name.trim(),
              phone: customer.phone.trim(),
              email: customer.email || '',
              points: newPointBalance
            }, { onConflict: 'customer_code' });

            if (user) {
              await supabase.from('kaoj_carts').delete().eq('user_id', user.id);
            }
          } catch (err) {}
        } else {
          const newPointBalance = Math.max(0, customerPoints - (applyPointsDiscount ? 50 : 0)) + pointsEarnedWithOrder;
          setCustomerPoints(newPointBalance);
          localStorage.setItem('kaoj_cust_points', newPointBalance.toString());
        }

        const itemsList = cart.map(i => `• ${i.qty}x *${i.name}* (${i.variant}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');
        const paymentLabel =
          customer.paymentMethod === 'deuna' ? '💜 Deuna!' :
          customer.paymentMethod === 'payphone' ? '💳 Tarjeta (Payphone)' : '🏦 Transferencia Bancaria';

        const whatsappMsg =
          `✨ *NUEVO PEDIDO KAOJ STORE* ✨\n\n` +
          `📦 *Orden:* ${orderCode}\n` +
          `🏷️ *CÓDIGO ÚNICO DE CLIENTE:* *${generatedCode}*\n` +
          `💎 *Puntos Ganados:* *+${pointsEarnedWithOrder} pts*\n` +
          (discountApplied > 0 ? `🎁 *Descuento Canjeado:* -$${discountApplied.toFixed(2)}\n` : '') +
          `👤 *Cliente:* ${customer.name}\n` +
          `📱 *Celular:* ${customer.phone}\n` +
          (customer.idCard ? `🪪 *Cédula:* ${customer.idCard}\n` : '') +
          `🚚 *Entrega:* ${deliveryObj.label}\n` +
          (customer.address ? `📍 *Dirección:* ${customer.address}\n` : '') +
          `💳 *Forma de Pago:* ${paymentLabel}\n\n` +
          `🛍️ *PRODUCTOS:*\n${itemsList}\n\n` +
          `💵 *Subtotal:* $${subtotal.toFixed(2)}\n` +
          (discountApplied > 0 ? `🏷️ *Descuento:* -$${discountApplied.toFixed(2)}\n` : '') +
          `🚚 *Envío:* $${deliveryObj.price.toFixed(2)}\n` +
          `💰 *TOTAL PAGADO:* *$${total.toFixed(2)}*\n\n` +
          (customer.receiptUrl ? `📸 *Comprobante:* \n${customer.receiptUrl}\n\n` : '') +
          `¡Hola! Acabo de hacer este pedido en Kaoj Store con mi código único de cliente. 💅✨`;

        const cleanNumber = settings.whatsapp_number.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(whatsappMsg)}`, '_blank');

        setCart([]);
        setIsCartOpen(false);
        setApplyPointsDiscount(false);
        setCustomer(prev => ({ ...prev, receiptUrl: '', payphoneRef: '' }));
        showToast(`🎉 ¡Pedido ${orderCode} recibido! Acumulaste +${pointsEarnedWithOrder} puntos.`);

        fetchStoreData();
      }

      // =======================================================================
      // ADMINISTRACIÓN: CREACIÓN Y EDICIÓN DE PRODUCTOS
      // =======================================================================
      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!newProd.name.trim() || !newProd.price) {
          return showToast('Ingresa nombre y precio', 'error');
        }

        const parsedVariants = newProd.variantsText.split(',').map(pair => {
          const parts = pair.split(':');
          const name = (parts[0] || '').trim();
          const stock = parseInt((parts[1] || '0').trim(), 10);
          return { name, stock: isNaN(stock) ? 0 : stock };
        }).filter(v => v.name);

        const prodPayload = {
          name: newProd.name.trim(),
          section: newProd.section,
          category: newProd.category,
          price: parseFloat(newProd.price),
          discount_price: newProd.discount_price ? parseFloat(newProd.discount_price) : null,
          image: newProd.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600',
          description: newProd.description.trim(),
          variant_label: newProd.variant_label.trim() || 'Tono / Talla',
          variants: parsedVariants.length > 0 ? parsedVariants : [{ name: 'Único', stock: 5 }],
          is_active: true
        };

        if (supabase) {
          const { data, error } = await supabase.from('kaoj_products').insert([prodPayload]).select();
          if (error) return showToast('Error al crear: ' + error.message, 'error');
          if (data && data[0]) setProducts([data[0], ...products]);
        } else {
          setProducts([{ ...prodPayload, id: Date.now() }, ...products]);
        }

        showToast('✅ Producto guardado en ' + newProd.section);
        setNewProd({
          name: '',
          section: newProd.section,
          category: (sectionsConfig[newProd.section] || [])[0] || '',
          price: '',
          discount_price: '',
          image: '',
          description: '',
          variant_label: 'Tono / Talla',
          variantsText: 'Rosa Nude:5, Rojo Carmesí:4'
        });
      }

      async function handleQuickStockChange(productId, variantName, delta) {
        const prod = products.find(p => p.id === productId);
        if (!prod || !prod.variants) return;

        const updatedVariants = prod.variants.map(v =>
          v.name === variantName ? { ...v, stock: Math.max(0, (v.stock || 0) + delta) } : v
        );

        if (supabase) {
          await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', productId);
        }

        setProducts(products.map(p => p.id === productId ? { ...p, variants: updatedVariants } : p));
        showToast(`Stock de "${variantName}" actualizado`);
      }

      async function handleDeleteProduct(productId) {
        if (!confirm('¿Eliminar este producto del inventario?')) return;
        if (supabase) {
          await supabase.from('kaoj_products').delete().eq('id', productId);
        }
        setProducts(products.filter(p => p.id !== productId));
        showToast('Producto eliminado');
      }

              <div className="bg-white rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative max-h-[95vh] overflow-y-auto">
                <div className="flex justify-between items-center no-print">
                  <h3 className="font-bold text-base text-gray-900 flex items-center gap-2">
                    <span>📦</span> Guía de Envío Servientrega
                  </h3>
                  <button onClick={() => setServientregaOrder(null)} className="font-bold text-gray-500 text-lg">✕</button>
                </div>

                <div id="servientrega-print-area" className="border-2 border-emerald-700 rounded-2xl p-5 bg-white text-gray-900 space-y-4">
                  <div className="flex justify-between items-center border-b-2 border-emerald-700 pb-3">
                    <div>
                      <span className="bg-emerald-700 text-white font-black text-base px-3 py-1 rounded-md tracking-wider">SERVIENTREGA</span>
                      <p className="text-[10px] text-gray-500 font-semibold mt-1">GUÍA DE ENVÍO NACIONAL</p>
                    </div>
                    <div className="text-right">
                      <span className="font-mono font-black text-sm">{servientregaOrder.order_code}</span>
                    </div>
                  </div>

                  <div className="text-center py-1 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                    <p className="font-barcode text-4xl leading-none">*{servientregaOrder.order_code}*</p>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div className="border rounded-xl p-3 bg-gray-50 space-y-1">
                      <p className="font-bold text-emerald-800 text-[11px] uppercase border-b pb-1">REMITENTE:</p>
                      <p className="font-bold">KAOJ STORE BOUTIQUE</p>
                      <p className="text-gray-600">Portoviejo / Manta - Manabí</p>
                      <p className="text-gray-600">Tel: +{settings.whatsapp_number}</p>
                    </div>

                    <div className="border-2 border-emerald-700 rounded-xl p-3 bg-emerald-50/30 space-y-1">
                      <p className="font-bold text-emerald-900 text-[11px] uppercase border-b border-emerald-200 pb-1">DESTINATARIO:</p>
                      <p className="font-bold text-sm">{servientregaOrder.customer_name}</p>
                      <p className="text-gray-700">Celular: <b>{servientregaOrder.customer_phone}</b></p>
                      <p className="text-gray-700">Dirección: <b>{servientregaOrder.delivery_address || 'Retiro Agencia'}</b></p>
                      <p className="text-emerald-800 font-bold text-[10px]">CÓDIGO ÚNICO: {servientregaOrder.customer_code}</p>
                    </div>
                  </div>

                  <div className="border rounded-xl p-3 text-xs space-y-1">
                    <div className="flex justify-between font-bold border-b pb-1">
                      <span>Contenido Declarado:</span><span>Total: ${Number(servientregaOrder.total).toFixed(2)}</span>
                    </div>
                    <div className="text-[11px] text-gray-600 pt-1">
                      {(servientregaOrder.items || []).map((it, i) => (
                        <p key={i}>• {it.qty}x {it.name} ({it.variant})</p>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 no-print">
                  <button onClick={() => window.print()} className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-bold text-xs shadow-md">
                    🖨️ Imprimir Guía (Térmica 10x15 o A4)
                  </button>
                  <button onClick={() => setServientregaOrder(null)} className="bg-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold text-xs">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: VISTA RÁPIDA DE PRODUCTO */}
          {quickViewProduct && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-pink-100 flex flex-col md:flex-row relative">
                <button onClick={() => setQuickViewProduct(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 flex items-center justify-center font-bold text-gray-600 shadow-md z-10">✕</button>
                <div className="md:w-1/2 h-64 md:h-auto bg-pink-50 relative">
                  <img src={quickViewProduct.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'} alt={quickViewProduct.name} className="w-full h-full object-cover" />
                </div>
                <div className="p-6 md:w-1/2 flex flex-col justify-between space-y-4">
                  <div>
                    <span className="text-[10px] font-extrabold bg-pink-100 text-[#FF2E93] px-2 py-0.5 rounded-full">
                      {quickViewProduct.section} • {quickViewProduct.category}
                    </span>
                    <h3 className="font-bold text-xl text-gray-900 leading-snug mt-1">{quickViewProduct.name}</h3>
                    <p className="text-xs text-gray-500 mt-2">{quickViewProduct.description}</p>
                    <div className="mt-4 flex items-baseline gap-2">
                      <span className="text-2xl font-black text-[#FF2E93]">${Number(quickViewProduct.discount_price || quickViewProduct.price).toFixed(2)}</span>
                      {quickViewProduct.discount_price && <span className="line-through text-gray-400 text-sm">${Number(quickViewProduct.price).toFixed(2)}</span>}
                    </div>
                  </div>
                  <button onClick={() => addToCart(quickViewProduct)} className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3 rounded-xl font-bold text-sm shadow-md transition">
                    Agregar al Carrito 🛍️
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: RASTREO */}
          {isTrackingOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                <button onClick={() => setIsTrackingOpen(false)} className="absolute top-4 right-4 text-gray-400 font-bold text-xl">✕</button>
                <h3 className="font-serif-kaoj text-2xl font-bold text-gray-900">🏷️ Consulta tus Pedidos</h3>
                <div className="flex gap-2">
                  <input type="text" value={trackingCode} onChange={e => setTrackingCode(e.target.value)} placeholder="Ej. J4567 o 0991234567" className="flex-1 border rounded-xl p-2.5 text-xs outline-none font-bold uppercase" />
                  <button onClick={async () => {
                    if (!trackingCode.trim()) return;
                    setTrackingLoading(true);
                    if (supabase) {
                      const { data } = await supabase.from('kaoj_orders').select('*').or(`customer_code.ilike.%${trackingCode.trim()}%,customer_phone.ilike.%${trackingCode.trim()}%`);
                      setTrackedOrders(data || []);
                    } else {
                      setTrackedOrders(orders.filter(o => o.customer_code === trackingCode.trim().toUpperCase()));
                    }
                    setTrackingLoading(false);
                  }} className="bg-[#FF2E93] text-white px-4 py-2.5 rounded-xl text-xs font-bold">
                    {trackingLoading ? 'Buscando...' : 'Buscar'}
                  </button>
                </div>
                {trackedOrders && (
                  <div className="space-y-2">
                    {trackedOrders.length === 0 ? <p className="text-xs text-gray-500 text-center py-4">No hay pedidos con ese código.</p> :
                      trackedOrders.map(o => (
                        <div key={o.id} className="border rounded-xl p-3 text-xs bg-pink-50/30 flex justify-between">
                          <div>
                            <span className="font-bold text-[#FF2E93]">{o.order_code}</span>
                            <p className="text-gray-500">{o.delivery_method}</p>
                          </div>
                          <span className="font-bold text-[#FF2E93]">{o.status}</span>
                        </div>
                      ))
                    }
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL CONFIGURACIÓN SUPABASE */}
          {isConfigOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                <button onClick={() => setIsConfigOpen(false)} className="absolute top-4 right-4 text-gray-400 font-bold text-xl">✕</button>
                <h3 className="font-bold text-lg text-gray-900">⚙️ Conectar Base de Datos Supabase</h3>
                <form onSubmit={e => {
                  e.preventDefault();
                  const cleanedUrl = cleanSupabaseUrl(configInputUrl);
                  const cleanedKey = configInputKey.trim();
                  if (!cleanedUrl || !cleanedKey) return;
                  supabase = window.supabase.createClient(cleanedUrl, cleanedKey);
                  localStorage.setItem('kaoj_supabase_url', cleanedUrl);
                  localStorage.setItem('kaoj_supabase_anon_key', cleanedKey);
                  setIsConfigOpen(false);
                  showToast('Supabase conectado');
                  fetchStoreData();
                }} className="space-y-3 text-xs">
                  <input required placeholder="https://xyz.supabase.co" value={configInputUrl} onChange={e => setConfigInputUrl(e.target.value)} className="w-full border rounded-xl p-2.5 outline-none font-mono" />
                  <input required placeholder="Anon Key" value={configInputKey} onChange={e => setConfigInputKey(e.target.value)} className="w-full border rounded-xl p-2.5 outline-none font-mono" />
                  <button type="submit" className="w-full bg-[#FF2E93] text-white py-3 rounded-xl font-bold text-xs shadow-md">Conectar Supabase 🚀</button>
                </form>
              </div>
            </div>
          )}

          {/* BOTÓN FLOTANTE WHATSAPP */}
          <a
            href={`https://wa.me/${settings.whatsapp_number.replace(/\D/g, '')}?text=${encodeURIComponent('¡Hola Kaoj Store! Me gustaría consultar sobre sus maquillajes y ropa. 💅✨')}`}
            target="_blank"
            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition duration-200"
          >
            <span className="text-2xl">💬</span>
          </a>

          {/* TOASTS */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2 bg-gray-900 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl border border-gray-800 animate-bounce">
              <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
              <p className="font-semibold">{toast.message}</p>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-pink-100 mt-16 text-xs text-gray-500 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-2">
                <h4 className="font-serif-kaoj text-2xl font-black text-[#FF2E93]">KAOJ STORE</h4>
                <p>Maquillajes, accesorios chic y moda con glamour. Entregas en Portoviejo, ULEAM Manta, San Jacinto y envíos Servientrega a todo el Ecuador.</p>
              </div>
              <div>
                <h5 className="font-bold text-gray-900 mb-2">Departamentos</h5>
                <ul className="space-y-1">
                  <li>💄 Maquillajes (9 categorías)</li>
                  <li>💍 Accesorios (Vinchas, Cintillos)</li>
                  <li>👗 Ropa Chic (7 categorías)</li>
                  <li>🔥 Ofertas Especiales</li>
                </ul>
              </div>
              <div>
                <h5 className="font-bold text-gray-900 mb-2">Formas de Pago</h5>
                <ul className="space-y-1">
                  <li>💜 Deuna! (App oficial)</li>
                  <li>💳 Tarjetas con Payphone</li>
                  <li>🏦 Banco Guayaquil & Pichincha</li>
                  <li>💎 Puntos VIP Kaoj</li>
                </ul>
              </div>
              <div className="space-y-2">
                <h5 className="font-bold text-gray-900">Contacto & Ayuda</h5>
                <p>WhatsApp: <b>+{settings.whatsapp_number}</b></p>
                <p>Correo: <b>{settings.email_contact}</b></p>
                <button onClick={() => setIsConfigOpen(true)} className="text-[11px] text-[#FF2E93] underline block pt-1">
                  ⚙️ Configuración Supabase
                </button>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 mt-8 border-t border-pink-50 text-center flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 KAOJ STORE. Todos los derechos reservados.</p>
              <p className="text-[11px] text-gray-400">Maquillajes, Accesorios & Ropa E-commerce 💅</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
