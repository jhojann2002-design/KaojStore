    function calculateCustomerCode(name, phone) {
      if (!name || !phone) return '';
      const cleanName = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const match = cleanName.match(/[a-zA-Z]/);
      const firstLetter = match ? match[0].toUpperCase() : 'K';
      const digits = phone.replace(/\D/g, '');
      if (digits.length < 4) return '';
      const last4 = digits.slice(-4);
      return `${firstLetter}${last4}`;
    }

    // =========================================================================

      const [customerPoints, setCustomerPoints] = useState(() => {
        return parseInt(localStorage.getItem('kaoj_cust_points') || '0', 10);

      const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
      const [newReview, setNewReview] = useState({
        name: '',
        customerCode: '',
        product_name: '',
        rating: 5,
        comment: '',
        photo_url: ''

      const [servientregaOrder, setServientregaOrder] = useState(null);

      // Modal Config Supabase
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [configInputUrl, setConfigInputUrl] = useState(supabaseConfig.url || '');
      const [configInputKey, setConfigInputKey] = useState(supabaseConfig.key || '');

      const [previewReceiptUrl, setPreviewReceiptUrl] = useState(null);
      const [editingProduct, setEditingProduct] = useState(null);

      // Carrito
      const [cart, setCart] = useState(() => {

          const saved = localStorage.getItem('kaoj_cart');

        setTimeout(() => setToast(null), 3800);

      const [customer, setCustomer] = useState(() => ({
        name: localStorage.getItem('kaoj_cust_name') || '',
        phone: localStorage.getItem('kaoj_cust_phone') || '',
        idCard: localStorage.getItem('kaoj_cust_id') || '',
        email: '',

        payphoneRef: ''

        price: '',
        discount_price: '',

      // =======================================================================
      // EFECTOS: PWA PROMPT Y SUPABASE AUTH
      // =======================================================================
      useEffect(() => {
        // Capturar evento de instalación de PWA
        window.addEventListener('beforeinstallprompt', e => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
          setShowInstallBanner(true);
        });

        initSupabaseAndAuth();
      }, []);

      async function initSupabaseAndAuth() {
        if (!supabase) return;
        await fetchStoreData();

        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) handleUserLoggedIn(session.user);

          supabase.auth.onAuthStateChange(async (event, session) => {
            if (session?.user) {
              handleUserLoggedIn(session.user);
            } else {
              setUser(null);
            }
          });
        } catch (err) {
          console.warn('Auth check error:', err);
        }
      }

      function handleUserLoggedIn(currentUser) {
        setUser(currentUser);
        const googleName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || '';
        const googleEmail = currentUser.email || '';
        setCustomer(prev => ({
          ...prev,
          name: prev.name || googleName,
          email: googleEmail
        }));

        syncCartFromCloud(currentUser.id);
        fetchCustomerPoints(currentUser.email);
      }

      async function fetchStoreData() {
        if (!supabase) return;
        try {
          const { data: prods } = await supabase.from('kaoj_products').select('*').eq('is_active', true).order('id', { ascending: false });
          if (prods && prods.length > 0) {
            setProducts(prods);
            const initVars = {};
            prods.forEach(p => {
              const firstAvail = (p.variants || []).find(v => v.stock > 0) || (p.variants || [])[0];
              if (firstAvail) initVars[p.id] = firstAvail.name;
            });
            setSelectedVariants(initVars);
          }

          const { data: cfg } = await supabase.from('kaoj_settings').select('*').eq('id', 1).single();
          if (cfg) setSettings(prev => ({ ...prev, ...cfg }));

          const { data: ords } = await supabase.from('kaoj_orders').select('*').order('created_at', { ascending: false });
          if (ords) setOrders(ords);

          const { data: revs } = await supabase.from('kaoj_reviews').select('*').eq('is_approved', true).order('created_at', { ascending: false });
          if (revs && revs.length > 0) setReviews(revs);
        } catch (err) {
          console.warn('Supabase fetch error:', err);
        }
      }

      // Buscar puntos del cliente en Supabase o en pedidos pasados
      async function fetchCustomerPoints(identifier) {
        if (!supabase || !identifier) return;
        try {
          const { data: cust } = await supabase.from('kaoj_customers').select('points').or(`customer_code.eq.${identifier},email.eq.${identifier}`).single();
          if (cust && cust.points !== undefined) {
            setCustomerPoints(cust.points);
            localStorage.setItem('kaoj_cust_points', cust.points.toString());
          }
        } catch (err) {}
      }

      // Al cambiar customerCode, consultar si ya tiene puntos acumulados
      useEffect(() => {
        if (customerCode) {
          fetchCustomerPoints(customerCode);
        }
      }, [customerCode]);

      // Guardar carrito en local y en la nube
      useEffect(() => {
        try {
          localStorage.setItem('kaoj_cart', JSON.stringify(cart));
        } catch (e) {}

        if (user && supabase) {
          supabase.from('kaoj_carts').upsert({
            user_id: user.id,
            customer_code: customerCode || '',
            items: cart,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
        }
      }, [cart, user, customerCode]);

      // Guardar datos básicos
      useEffect(() => {
        if (customer.name) localStorage.setItem('kaoj_cust_name', customer.name);
        if (customer.phone) localStorage.setItem('kaoj_cust_phone', customer.phone);
        if (customer.idCard) localStorage.setItem('kaoj_cust_id', customer.idCard);
        if (customer.address) localStorage.setItem('kaoj_cust_addr', customer.address);
      }, [customer.name, customer.phone, customer.idCard, customer.address]);

      async function syncCartFromCloud(userId) {
        if (!supabase) return;
        try {
          const { data } = await supabase.from('kaoj_carts').select('items').eq('user_id', userId).single();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            setCart(prevCart => {
              if (prevCart.length === 0) return data.items;
              const merged = [...data.items];
              prevCart.forEach(localItem => {
                const existing = merged.find(i => i.key === localItem.key);
                if (existing) {
                  existing.qty = Math.max(existing.qty, localItem.qty);
                } else {
                  merged.push(localItem);
                }
              });
              return merged;
            });
            showToast('☁️ Carrito sincronizado con tu cuenta Google');
          }
        } catch (err) {}
      }

      // =======================================================================
      // ACCIONES PWA Y GOOGLE LOGIN
      // =======================================================================
      async function handleInstallPwaClick() {
        if (!deferredInstallPrompt) return;

          showToast('💅 ¡Gracias por instalar Kaoj Store!');

        setDeferredInstallPrompt(null);
        setShowInstallBanner(false);
      }

      async function handleGoogleLogin() {
        if (!supabase) {
          setIsConfigOpen(true);
          return showToast('Configura Supabase primero.', 'info');
        }
        const redirectUrl = window.location.origin + window.location.pathname;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectUrl }
        });
        if (error) showToast('Error Google: ' + error.message, 'error');
      }

      async function handleLogout() {
        if (supabase) await supabase.auth.signOut();
        setUser(null);
        setIsProfileOpen(false);
        showToast('Sesión cerrada');

      // CARRITO Y CÁLCULOS (CON SISTEMA DE PUNTOS)
      // =======================================================================
      function addToCart(product, specificVariant = null) {
        const varName = specificVariant || selectedVariants[product.id] || (product.variants?.[0]?.name);
        const variantObj = (product.variants || []).find(v => v.name === varName);

        if (!variantObj || variantObj.stock <= 0) {
          return showToast(`"${varName}" está agotado.`, 'error');
        }

        const key = `${product.id}_${varName}`;
        const existing = cart.find(i => i.key === key);

        if (existing && existing.qty >= variantObj.stock) {
          return showToast(`Máximo disponible: ${variantObj.stock} unidades.`, 'error');
        }

        const unitPrice = product.discount_price ? Number(product.discount_price) : Number(product.price);

        if (existing) {
          setCart(cart.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, {
            key,
            productId: product.id,
            name: product.name,
            variant: varName,
            price: unitPrice,
            qty: 1,
            image: product.image
          }]);
        }

        showToast(`✨ ¡"${product.name}" agregado!`);
        setIsCartOpen(true);
        if (quickViewProduct) setQuickViewProduct(null);
      }

      function updateCartQty(key, delta) {
        setCart(cart.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            const prod = products.find(p => p.id === item.productId);
            const varObj = prod?.variants?.find(v => v.name === item.variant);
            const maxStock = varObj ? varObj.stock : 99;

            if (newQty > maxStock) {
              showToast(`Stock máximo: ${maxStock}`, 'info');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      }

      function removeFromCart(key) {
        setCart(cart.filter(i => i.key !== key));
        showToast('Producto retirado del carrito', 'info');
      }

      // Cálculos Financieros y Descuento de Puntos
      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const deliveryObj = DELIVERY_OPTIONS.find(d => d.id === customer.delivery) || DELIVERY_OPTIONS[0];

      // Regla de Puntos: 50 puntos = $5.00 de descuento
      const pointsDiscountValue = (settings.points_min_redeem || 50) / (settings.points_redeem_ratio || 10);
      const canRedeemPoints = customerPoints >= (settings.points_min_redeem || 50);
      const discountApplied = (applyPointsDiscount && canRedeemPoints) ? pointsDiscountValue : 0;

      const total = Math.max(0, subtotal + deliveryObj.price - discountApplied);
      // Puntos generados con esta compra (1 dólar = 1 punto)
      const pointsEarnedWithOrder = Math.floor(Math.max(0, subtotal - discountApplied));

      // Subida de archivos
      async function uploadFileToSupabase(file, folder = 'receipts') {
        if (!supabase) {
          showToast('Conecta Supabase primero para subir imágenes a la nube.', 'error');
          return null;
        }
        setUploading(true);
        try {
          const ext = file.name.split('.').pop();
          const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
          const fileName = `${folder}/${Date.now()}_${cleanName}.${ext}`;

          const { error: uploadError } = await supabase.storage
            .from('kaoj-assets')
            .upload(fileName, file, { cacheControl: '3600', upsert: true });

          if (uploadError) throw uploadError;

          const { data } = supabase.storage.from('kaoj-assets').getPublicUrl(fileName);
          setUploading(false);
          showToast('📸 Imagen subida exitosamente');
          return data.publicUrl;
        } catch (err) {
          setUploading(false);
          showToast('Error subida: ' + err.message, 'error');
          return null;
        }
      }

      // =======================================================================
      // FINALIZAR PEDIDO (CON DESCUENTO DE PUNTOS Y PAYPHONE)
      // =======================================================================
      async function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) return showToast('El carrito está vacío', 'error');
        if (!customer.name.trim() || !customer.phone.trim()) {
          return showToast('Ingresa tu nombre y celular para generar tu código.', 'error');
        }

        // Si el método no es Payphone ni efectivo, requerir comprobante
        if (customer.paymentMethod !== 'payphone' && !customer.receiptUrl) {
          return showToast('⚠️ Sube la captura de tu pago para asegurar tus productos.', 'error');
        }

        const generatedCode = customerCode || calculateCustomerCode(customer.name, customer.phone);
        const orderCode = `KAOJ-${Math.floor(100000 + Math.random() * 900000)}`;

        const orderData = {
          order_code: orderCode,
          customer_code: generatedCode,
          customer_name: customer.name.trim(),
          customer_phone: customer.phone.trim(),
          customer_id_card: customer.idCard.trim(),
          customer_email: customer.email || user?.email || '',
          user_id: user?.id || null,
          delivery_method: deliveryObj.label,
          delivery_address: customer.address.trim(),
          shipping_cost: deliveryObj.price,
          subtotal: subtotal,
          discount_amount: discountApplied,
          total: total,
          points_earned: pointsEarnedWithOrder,
          points_redeemed: applyPointsDiscount ? (settings.points_min_redeem || 50) : 0,
          payment_method:
            customer.paymentMethod === 'deuna' ? 'Deuna!' :
            customer.paymentMethod === 'payphone' ? 'Payphone (Tarjeta)' : 'Transferencia Bancaria',
          receipt_url: customer.receiptUrl || (customer.payphoneRef ? `Payphone Ref: ${customer.payphoneRef}` : ''),
          items: cart,
          status: 'pendiente'
        };

        if (supabase) {
          try {
            await supabase.from('kaoj_orders').insert([orderData]);

            // Descontar inventario
            for (const item of cart) {
              const prod = products.find(p => p.id === item.productId);
              if (prod && Array.isArray(prod.variants)) {
                const updatedVariants = prod.variants.map(v =>
                  v.name === item.variant ? { ...v, stock: Math.max(0, v.stock - item.qty) } : v
                );
                await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', prod.id);
              }
            }

            // Actualizar Puntos de la Clienta
            const newPointBalance = Math.max(0, customerPoints - (applyPointsDiscount ? 50 : 0)) + pointsEarnedWithOrder;
            setCustomerPoints(newPointBalance);
            localStorage.setItem('kaoj_cust_points', newPointBalance.toString());

            await supabase.from('kaoj_customers').upsert({
              customer_code: generatedCode,
              name: customer.name.trim(),
              phone: customer.phone.trim(),
              email: customer.email || '',
              points: newPointBalance
            }, { onConflict: 'customer_code' });

            if (user) {
              await supabase.from('kaoj_carts').delete().eq('user_id', user.id);
            }
          } catch (err) {
            console.warn('Checkout error:', err);
          }
        } else {
          // Modo offline
          const newPointBalance = Math.max(0, customerPoints - (applyPointsDiscount ? 50 : 0)) + pointsEarnedWithOrder;
          setCustomerPoints(newPointBalance);
          localStorage.setItem('kaoj_cust_points', newPointBalance.toString());
        }

        // Armar mensaje WhatsApp
        const itemsList = cart.map(i => `• ${i.qty}x *${i.name}* (${i.variant}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');
        const paymentLabel =
          customer.paymentMethod === 'deuna' ? '💜 Deuna!' :
          customer.paymentMethod === 'payphone' ? '💳 Tarjeta de Crédito/Débito (Payphone)' : '🏦 Transferencia Bancaria';

        const whatsappMsg =
          `✨ *NUEVO PEDIDO KAOJ STORE* ✨\n\n` +
          `📦 *Orden:* ${orderCode}\n` +
          `🏷️ *CÓDIGO ÚNICO DE CLIENTE:* *${generatedCode}*\n` +
          `💎 *PUNTOS KAOJ GANADOS:* *+${pointsEarnedWithOrder} pts*\n` +
          (discountApplied > 0 ? `🎁 *Descuento de Puntos Canjeado:* -$${discountApplied.toFixed(2)}\n` : '') +
          `👤 *Cliente:* ${customer.name}\n` +
          `📱 *Celular:* ${customer.phone}\n` +
          (customer.idCard ? `🪪 *Cédula:* ${customer.idCard}\n` : '') +
          `🚚 *Entrega:* ${deliveryObj.label}\n` +
          (customer.address ? `📍 *Dirección:* ${customer.address}\n` : '') +
          `💳 *Forma de Pago:* ${paymentLabel}\n\n` +
          `🛍️ *PRODUCTOS:*\n${itemsList}\n\n` +
          `💵 *Subtotal:* $${subtotal.toFixed(2)}\n` +
          (discountApplied > 0 ? `🏷️ *Descuento:* -$${discountApplied.toFixed(2)}\n` : '') +
          `🚚 *Envío:* $${deliveryObj.price.toFixed(2)}\n` +
          `💰 *TOTAL PAGADO:* *$${total.toFixed(2)}*\n\n` +
          (customer.receiptUrl ? `📸 *Comprobante de Pago:* \n${customer.receiptUrl}\n\n` : '') +
          (customer.payphoneRef ? `🧾 *Ref. Transacción Payphone:* ${customer.payphoneRef}\n\n` : '') +
          `¡Hola Kaoj Store! Acabo de hacer este pedido en la web con mi código único de cliente. 💅✨`;

        const cleanNumber = settings.whatsapp_number.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(whatsappMsg)}`, '_blank');

        setCart([]);
        setIsCartOpen(false);
        setApplyPointsDiscount(false);
        setCustomer(prev => ({ ...prev, receiptUrl: '', payphoneRef: '' }));
        showToast(`🎉 ¡Pedido ${orderCode} recibido! Acumulaste +${pointsEarnedWithOrder} Puntos Kaoj.`);

        fetchStoreData();
      }

      // =======================================================================
      // MURO DE RESEÑAS: PUBLICAR NUEVA OPINIÓN
      // =======================================================================
      async function handleCreateReview(e) {
        e.preventDefault();
        if (!newReview.name.trim() || !newReview.comment.trim()) {
          return showToast('Ingresa tu nombre y tu comentario sobre el producto', 'error');
        }

        const reviewPayload = {
          customer_name: newReview.name.trim(),
          customer_code: newReview.customerCode.trim() || customerCode || '',
          product_name: newReview.product_name.trim() || 'Kaoj Store Boutique',
          rating: parseInt(newReview.rating, 10) || 5,
          comment: newReview.comment.trim(),
          photo_url: newReview.photo_url || '',
          is_verified_buyer: true,
          is_approved: true
        };

        if (supabase) {
          const { data, error } = await supabase.from('kaoj_reviews').insert([reviewPayload]).select();
          if (error) return showToast('Error al publicar reseña: ' + error.message, 'error');
          if (data && data[0]) setReviews([data[0], ...reviews]);
        } else {
          setReviews([{ ...reviewPayload, id: Date.now(), created_at: new Date().toISOString() }, ...reviews]);
        }

        showToast('💖 ¡Gracias por tu reseña y por ser parte de Kaoj Store!');
        setIsReviewModalOpen(false);
        setNewReview({ name: '', customerCode: '', product_name: '', rating: 5, comment: '', photo_url: '' });
      }

      // =======================================================================
      // RASTREO DE PEDIDOS
      // =======================================================================
      async function handleSearchOrders() {
        if (!trackingCode.trim()) return showToast('Ingresa tu código único o celular', 'info');
        setTrackingLoading(true);
        setTrackedOrders(null);

        const cleanInput = trackingCode.trim().toUpperCase();
        const digits = trackingCode.replace(/\D/g, '');

        if (!supabase) {
          const filtered = orders.filter(o =>
            (o.customer_code && o.customer_code.toUpperCase() === cleanInput) ||
            (o.order_code && o.order_code.toUpperCase() === cleanInput) ||
            (digits && o.customer_phone && o.customer_phone.includes(digits))
          );
          setTrackedOrders(filtered);
          setTrackingLoading(false);
          return;
        }

        try {
          const { data, error } = await supabase
            .from('kaoj_orders')
            .select('*')
            .or(`customer_code.ilike.%${cleanInput}%,order_code.ilike.%${cleanInput}%,customer_phone.ilike.%${digits}%`)
            .order('created_at', { ascending: false });

          if (error) throw error;
          setTrackedOrders(data || []);
        } catch (err) {
          showToast('Error: ' + err.message, 'error');
        } finally {
          setTrackingLoading(false);
        }
      }

      // =======================================================================
      // ADMINISTRACIÓN: INVENTARIO, ESTADOS Y SERVIENTREGA
      // =======================================================================
      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!newProd.name.trim() || !newProd.price) {
          return showToast('Ingresa nombre y precio del producto', 'error');
        }

        const parsedVariants = newProd.variantsText.split(',').map(pair => {
          const parts = pair.split(':');
          const name = (parts[0] || '').trim();
          const stock = parseInt((parts[1] || '0').trim(), 10);
          return { name, stock: isNaN(stock) ? 0 : stock };
        }).filter(v => v.name);

        const prodPayload = {
          name: newProd.name.trim(),
          category: newProd.category,
          price: parseFloat(newProd.price),
          discount_price: newProd.discount_price ? parseFloat(newProd.discount_price) : null,
          image: newProd.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600',
          description: newProd.description.trim(),
          variant_label: newProd.variant_label.trim() || 'Tono / Talla',
          variants: parsedVariants.length > 0 ? parsedVariants : [{ name: 'Único', stock: 5 }],
          is_active: true
        };

        if (supabase) {
          const { data, error } = await supabase.from('kaoj_products').insert([prodPayload]).select();
          if (error) return showToast('Error al crear: ' + error.message, 'error');
          if (data && data[0]) setProducts([data[0], ...products]);
        } else {
          setProducts([{ ...prodPayload, id: Date.now() }, ...products]);
        }

        showToast('✅ Producto guardado en Supabase');
        setNewProd({
          name: '', category: 'Labiales', price: '', discount_price: '',
          image: '', description: '', variant_label: 'Tono / Talla',
          variantsText: 'Rosa Nude:5, Rojo Carmesí:4'
        });
      }

      async function handleQuickStockChange(productId, variantName, delta) {
        const prod = products.find(p => p.id === productId);
        if (!prod || !prod.variants) return;

        const updatedVariants = prod.variants.map(v =>
          v.name === variantName ? { ...v, stock: Math.max(0, (v.stock || 0) + delta) } : v
        );

        if (supabase) {
          await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', productId);
        }

        setProducts(products.map(p => p.id === productId ? { ...p, variants: updatedVariants } : p));
        showToast(`Stock de "${variantName}" actualizado`);
      }

      async function handleDeleteProduct(productId) {
        if (!confirm('¿Eliminar este producto del inventario?')) return;
        if (supabase) {
          await supabase.from('kaoj_products').delete().eq('id', productId);
        }
        setProducts(products.filter(p => p.id !== productId));
        showToast('Producto eliminado');
      }

      async function handleOrderStatusChange(orderId, newStatus) {
        if (supabase) {
          await supabase.from('kaoj_orders').update({ status: newStatus }).eq('id', orderId);
        }
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast(`Estado actualizado a "${newStatus}"`);
      }

      function notifyCustomerWhatsApp(order) {
        const statusMap = {
          'pendiente': 'recibido y está en revisión de comprobante.',
          'verificado': 'aprobado y estamos empaquetando tus productos con amor. 💅✨',
          'en_camino': 'despachado con Servientrega / Domicilio y va en camino a ti. 🚚💨',
          'entregado': 'entregado con éxito. ¡Esperamos que te encante tu compra! 💖',
          'cancelado': 'cancelado. Comunícate con nosotras si necesitas ayuda.'
        };

        const msg =
          `Hola *${order.customer_name}*, te saludamos desde *KAOJ STORE* 💖\n\n` +
          `Te informamos que tu pedido *${order.order_code}* (Código Único: *${order.customer_code}*) ha sido ${statusMap[order.status] || 'actualizado.'}\n\n` +
          `Total: $${Number(order.total).toFixed(2)}\n\n` +
          `¡Gracias por preferirnos! Siempre a tus órdenes. ✨`;

        const cleanNumber = order.customer_phone.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(msg)}`, '_blank');
      }

      async function handleSaveSettings() {
        if (supabase) {
          await supabase.from('kaoj_settings').upsert([settings]);
        }
        showToast('⚙️ Ajustes guardados en Supabase');
      }

      function handleSaveSupabaseConfig(e) {
        e.preventDefault();
        const trimmedUrl = configInputUrl.trim();
        const trimmedKey = configInputKey.trim();

        if (!trimmedUrl || !trimmedKey) return showToast('Ingresa URL y Anon Key', 'error');

        try {
          supabase = window.supabase.createClient(trimmedUrl, trimmedKey);
          localStorage.setItem('kaoj_supabase_url', trimmedUrl);
          localStorage.setItem('kaoj_supabase_anon_key', trimmedKey);
          supabaseConfig = { url: trimmedUrl, key: trimmedKey };
          setIsConfigOpen(false);
          showToast('🚀 Conexión con Supabase configurada');
          fetchStoreData();
        } catch (err) {
          showToast('Error Supabase: ' + err.message, 'error');
        }
      }

      // Filtrado y ordenamiento de productos
      const filteredProducts = useMemo(() => {
        let result = [...products];
        if (category !== 'Todos') {
          if (category === 'Ofertas') {
            result = result.filter(p => Boolean(p.discount_price));
          } else {
            result = result.filter(p => p.category === category);
          }
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          result = result.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.description?.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q)
          );
        }
        if (sortBy === 'precio_menor') {
          result.sort((a, b) => (a.discount_price || a.price) - (b.discount_price || b.price));
        } else if (sortBy === 'precio_mayor') {
          result.sort((a, b) => (b.discount_price || b.price) - (a.discount_price || a.price));
        } else if (sortBy === 'ofertas') {
          result.sort((a, b) => (b.discount_price ? 1 : 0) - (a.discount_price ? 1 : 0));
        }
        return result;
      }, [products, category, searchQuery, sortBy]);

      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          const matchStatus = adminOrderFilter === 'todos' || o.status === adminOrderFilter;
          const q = adminSearch.toLowerCase().trim();
          const matchSearch = !q ||
            o.order_code?.toLowerCase().includes(q) ||
            o.customer_code?.toLowerCase().includes(q) ||
            o.customer_name?.toLowerCase().includes(q) ||
            o.customer_phone?.includes(q);
          return matchStatus && matchSearch;
        });
      }, [orders, adminOrderFilter, adminSearch]);

      // =======================================================================
      // RENDERIZADO PRINCIPAL
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col bg-[#FDFAFC]">

          {/* BANNER INSTALAR PWA (MÓVILES Y ESCRITORIO) */}
          {showInstallBanner && (
            <div className="bg-gray-900 text-white text-xs px-4 py-2.5 flex items-center justify-between gap-3 shadow-md border-b border-pink-500/30">
              <div className="flex items-center gap-2">
                <span className="text-lg">📲</span>
                <div>
                  <p className="font-bold">¡Instala la App de KAOJ STORE en tu celular!</p>
                  <p className="text-[11px] text-gray-300">Acceso rápido a tus labiales favoritos y ofertas instantáneas.</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={handleInstallPwaClick}
                  className="bg-[#FF2E93] hover:bg-[#e0157a] text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-xs"
                >
                  Instalar App
                </button>
                <button onClick={() => setShowInstallBanner(false)} className="text-gray-400 hover:text-white px-1">✕</button>
              </div>
            </div>
          )}

          {/* BANNER PROMO SUPERIOR CON SALDO DE PUNTOS */}
          <div className="bg-gradient-to-r from-[#FF2E93] via-[#E0157A] to-[#B80D61] text-white text-xs py-2 px-4 text-center font-medium tracking-wide shadow-xs flex items-center justify-center gap-3">
            <span className="hidden sm:inline">✨</span>
            <p className="truncate max-w-2xl">{settings.banner_message}</p>
            {customerPoints > 0 && (
              <span className="bg-white/20 backdrop-blur-xs text-white text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                💎 Tienes {customerPoints} Puntos Kaoj
              </span>
            )}
            <span className="hidden sm:inline">✨</span>
          </div>

          {/* HEADER PRINCIPAL */}
          <header className="bg-white/95 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

              {/* LOGO */}
              <div
                onClick={() => { setIsAdmin(false); setCategory('Todos'); }}
                className="cursor-pointer select-none text-left group"
              >
                <div className="flex items-center gap-1.5">
                  <h1 className="font-serif-kaoj text-3xl sm:text-4xl font-extrabold text-[#FF2E93] tracking-wider leading-none group-hover:scale-[1.02] transition">
                    KAOJ
                  </h1>
                  <span className="text-xl">💅</span>
                </div>
                <span className="block text-[10px] sm:text-[11px] tracking-[0.45em] text-gray-700 font-bold mt-0.5">
                  STORE
                </span>
              </div>

              {/* BARRA DE BÚSQUEDA */}
              {!isAdmin && (
                <div className="hidden md:flex flex-1 max-w-md mx-4 relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">🔍</span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Buscar labial, skincare, blusa, vestido..."
                    className="w-full pl-10 pr-8 py-2 text-xs sm:text-sm bg-pink-50/50 border border-pink-200 rounded-full focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#FF2E93] transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-gray-400">✕</button>
                  )}
                </div>
              )}

              {/* ACCIONES DEL HEADER */}
              <div className="flex items-center gap-2 sm:gap-3">

                {/* BOTÓN RASTREAR PEDIDOS */}
                {!isAdmin && (
                  <button
                    onClick={() => setIsTrackingOpen(true)}
                    className="text-xs px-3 py-2 rounded-full border border-pink-200 hover:border-[#FF2E93] hover:bg-pink-50 text-gray-700 font-semibold transition flex items-center gap-1.5"
                    title="Rastrear pedido por Código Único"
                  >
                    <span>🏷️</span>
                    <span className="hidden sm:inline">Mis Pedidos</span>
                  </button>
                )}

                {/* BOTÓN PUNTOS KAOJ VIP */}
                {!isAdmin && customerPoints > 0 && (
                  <button
                    onClick={() => {
                      showToast(`💎 Tienes ${customerPoints} puntos acumulados. ¡Canjea 50 puntos por $5 de descuento en el carrito!`);
                    }}
                    className="hidden lg:flex items-center gap-1 text-xs px-3 py-2 rounded-full bg-pink-50 border border-pink-200 text-[#FF2E93] font-extrabold"
                  >
                    <span>💎</span>
                    <span>{customerPoints} pts</span>
                  </button>
                )}

            title="Chatea con nosotras por WhatsApp"
          >
            <span className="text-2xl">💬</span>
          </a>

          {/* TOASTS */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2 bg-gray-900 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl border border-gray-800 animate-bounce">
              <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
              <p className="font-semibold">{toast.message}</p>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-pink-100 mt-16 text-xs text-gray-500 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-2">
                <h4 className="font-serif-kaoj text-2xl font-black text-[#FF2E93]">KAOJ STORE</h4>
                <p>Maquillaje, skincare dermatológico y moda chic. Entregas personales en Portoviejo, ULEAM Manta, San Jacinto y envíos a todo el Ecuador.</p>
              </div>
              <div>
                <h5 className="font-bold text-gray-900 mb-2">Entregas & Retiros</h5>
                <ul className="space-y-1">
                  <li>📍 Portoviejo (Retiro Gratis)</li>
                  <li>📍 ULEAM Manta (Retiro Gratis)</li>
                  <li>📍 San Jacinto (Retiro Gratis)</li>
                  <li>🚚 Servientrega Nacional</li>
                </ul>
              </div>
              <div>
                <h5 className="font-bold text-gray-900 mb-2">Formas de Pago</h5>
                <ul className="space-y-1">
                  <li>💜 Deuna! (App oficial)</li>
                  <li>💳 Tarjetas con Payphone</li>
                  <li>🏦 Banco Guayaquil & Pichincha</li>
                  <li>💎 Puntos Kaoj VIP</li>
                </ul>
              </div>
              <div className="space-y-2">
                <h5 className="font-bold text-gray-900">Contacto & Ayuda</h5>
                <p>WhatsApp: <b>+{settings.whatsapp_number}</b></p>
                <p>Correo: <b>{settings.email_contact}</b></p>
                <button onClick={() => setIsConfigOpen(true)} className="text-[11px] text-[#FF2E93] underline block pt-1">
                  ⚙️ Configuración Supabase
                </button>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 mt-8 border-t border-pink-50 text-center flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 KAOJ STORE. Todos los derechos reservados.</p>
              <p className="text-[11px] text-gray-400">PWA, Servientrega & Supabase E-commerce 💅</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
