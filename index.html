  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // CONFIGURACIÓN DE SUPABASE

    // Puedes colocar tus credenciales aquí o configurarlas directamente en la web

    const DEFAULT_SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';

    // Categorías del catálogo

      {

        price: 16.50,
        discount_price: 13.99,
        image: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=800&auto=format&fit=crop&q=80',
        description: 'Textura gel ultra ligera que refuerza la barrera cutánea sin sensación pesada ni grasa.',

    // =========================================================================
    // FUNCIÓN DEL CÓDIGO ÚNICO DE CLIENTE
    // Regla: 1ª letra del nombre (mayúscula) + últimos 4 dígitos del celular
    // Ejemplo: Jhojann + 0991234567 -> "J4567"
    // =========================================================================
    function calculateCustomerCode(name, phone) {
      if (!name || !phone) return '';
      const cleanName = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const match = cleanName.match(/[a-zA-Z]/);
      const firstLetter = match ? match[0].toUpperCase() : 'K';
      const digits = phone.replace(/\D/g, '');
      if (digits.length < 4) return '';
      const last4 = digits.slice(-4);
      return `${firstLetter}${last4}`;
    }

    // =========================================================================
    // COMPONENTE PRINCIPAL APP
    // =========================================================================
    function App() {
      // Estado de Base de Datos y Tienda
      const [products, setProducts] = useState(DEMO_PRODUCTS);
      const [orders, setOrders] = useState([]);
      const [settings, setSettings] = useState({
        whatsapp_number: '593999999999',
        deuna_link: 'https://deuna.app/',
        deuna_qr_url: '',
        admin_pin: '2026',
        bank_guayaquil_acc: '0013899619',
        bank_guayaquil_name: 'Toledo Mendoza Alisson Kandy',
        bank_guayaquil_id: '1350290308',
        bank_pichincha_acc: '2215807440',
        bank_pichincha_name: 'Demera García Jhojann Alberto',
        bank_pichincha_id: '1314710946',
        email_contact: 'kaoj.store.ecu@gmail.com',
        banner_message: '✨ Recuerda: No es un gasto, es una inversión en ti misma. 💅✨ | Entregas en Portoviejo, Manta, San Jacinto y Envíos a todo Ecuador'
      });

      // Estados de UI y Navegación
      const [category, setCategory] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('destacados'); // 'destacados', 'precio_menor', 'precio_mayor', 'ofertas'
      const [selectedVariants, setSelectedVariants] = useState({});
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminTab, setAdminTab] = useState('inventory'); // 'inventory', 'orders', 'settings'
      const [adminOrderFilter, setAdminOrderFilter] = useState('todos');
      const [adminSearch, setAdminSearch] = useState('');
      const [uploading, setUploading] = useState(false);

      // Estado de Autenticación con Google
      const [user, setUser] = useState(null);
      const [isProfileOpen, setIsProfileOpen] = useState(false);
      const [isTrackingOpen, setIsTrackingOpen] = useState(false);
      const [trackingCode, setTrackingCode] = useState('');
      const [trackedOrders, setTrackedOrders] = useState(null);
      const [trackingLoading, setTrackingLoading] = useState(false);

      // Modal de configuración de credenciales Supabase
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [configInputUrl, setConfigInputUrl] = useState(supabaseConfig.url || '');
      const [configInputKey, setConfigInputKey] = useState(supabaseConfig.key || '');

      // Modal para ver imagen de comprobante en pantalla completa
      const [previewReceiptUrl, setPreviewReceiptUrl] = useState(null);

      // Modal de edición de producto en Admin
      const [editingProduct, setEditingProduct] = useState(null);

      // Carrito con persistencia en localStorage y Supabase
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('kaoj_cart');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // Toasts / Notificaciones
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Formulario del Cliente en Checkout
      const [customer, setCustomer] = useState(() => {
        return {
          name: localStorage.getItem('kaoj_cust_name') || '',
          phone: localStorage.getItem('kaoj_cust_phone') || '',
          idCard: localStorage.getItem('kaoj_cust_id') || '',
          email: '',
          delivery: 'retiro_portoviejo',
          address: localStorage.getItem('kaoj_cust_addr') || '',
          paymentMethod: 'deuna',
          receiptUrl: ''
        };
      });

      // Código único de cliente calculado en vivo
      const customerCode = useMemo(() => {
        return calculateCustomerCode(customer.name, customer.phone);
      }, [customer.name, customer.phone]);

      // Formulario de nuevo producto en Admin
      const [newProd, setNewProd] = useState({
        name: '',
        category: 'Labiales',
        price: '',
        discount_price: '',
        image: '',
        description: '',
        variant_label: 'Tono / Talla',
        variantsText: 'Rosa Nude:5, Rojo Carmesí:4, Berry Wine:3'
      });

      // =======================================================================
      // CARGAR DATOS Y ESCUCHAR SESIÓN DE GOOGLE
      // =======================================================================
      useEffect(() => {
        initSupabaseAndAuth();
      }, []);

      async function initSupabaseAndAuth() {
        if (!supabase) return;

        // 1. Cargar productos, configuración y pedidos desde Supabase
        await fetchStoreData();

        // 2. Comprobar sesión activa de Google
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) {
            handleUserLoggedIn(session.user);
          }

          // Escuchar cambios de autenticación
          supabase.auth.onAuthStateChange(async (event, session) => {
            if (session?.user) {
              handleUserLoggedIn(session.user);
            } else {
              setUser(null);
            }
          });
        } catch (err) {
          console.warn('Error en auth listener:', err);
        }
      }

      function handleUserLoggedIn(currentUser) {
        setUser(currentUser);
        // Pre-llenar datos del cliente desde Google
        const googleName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || '';
        const googleEmail = currentUser.email || '';
        setCustomer(prev => ({
          ...prev,
          name: prev.name || googleName,
          email: googleEmail
        }));

        // Sincronizar carrito desde Supabase (kaoj_carts)
        syncCartFromCloud(currentUser.id);
      }

      // Cargar productos y configuración desde Supabase
      async function fetchStoreData() {
        if (!supabase) return;
        try {
          // Cargar productos
          const { data: prods, error: pErr } = await supabase
            .from('kaoj_products')
            .select('*')
            .eq('is_active', true)
            .order('id', { ascending: false });

          if (prods && prods.length > 0) {
            setProducts(prods);
            // Inicializar variante por defecto para cada producto
            const initVars = {};
            prods.forEach(p => {
              const firstAvail = (p.variants || []).find(v => v.stock > 0) || (p.variants || [])[0];
              if (firstAvail) initVars[p.id] = firstAvail.name;
            });
            setSelectedVariants(initVars);
          }

          // Cargar configuración de tienda
          const { data: cfg } = await supabase.from('kaoj_settings').select('*').eq('id', 1).single();
          if (cfg) {
            setSettings(prev => ({ ...prev, ...cfg }));
          }

          // Cargar pedidos para admin
          const { data: ords } = await supabase.from('kaoj_orders').select('*').order('created_at', { ascending: false });
          if (ords) {
            setOrders(ords);
          }
        } catch (err) {
          console.warn('Error fetching data from Supabase:', err);
        }
      }

      // =======================================================================
      // PERSISTENCIA Y SINCRONIZACIÓN DE CARRITO
      // =======================================================================
      // Guardar en localStorage siempre
      useEffect(() => {
        try {
          localStorage.setItem('kaoj_cart', JSON.stringify(cart));
        } catch (e) {}

        // Si el usuario está conectado con Google, guardar en Supabase kaoj_carts
        if (user && supabase) {
          supabase.from('kaoj_carts').upsert({
            user_id: user.id,
            customer_code: customerCode || '',
            items: cart,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' }).then(() => {});
        }
      }, [cart, user, customerCode]);

      // Guardar datos básicos del cliente para agilizar futuras compras
      useEffect(() => {
        if (customer.name) localStorage.setItem('kaoj_cust_name', customer.name);
        if (customer.phone) localStorage.setItem('kaoj_cust_phone', customer.phone);
        if (customer.idCard) localStorage.setItem('kaoj_cust_id', customer.idCard);
        if (customer.address) localStorage.setItem('kaoj_cust_addr', customer.address);
      }, [customer.name, customer.phone, customer.idCard, customer.address]);

      // Traer carrito desde la nube al iniciar sesión con Google
      async function syncCartFromCloud(userId) {
        if (!supabase) return;
        try {
          const { data } = await supabase.from('kaoj_carts').select('items').eq('user_id', userId).single();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            setCart(prevCart => {
              if (prevCart.length === 0) return data.items;
              // Fusionar sin duplicar
              const merged = [...data.items];
              prevCart.forEach(localItem => {
                const existing = merged.find(i => i.key === localItem.key);
                if (existing) {
                  existing.qty = Math.max(existing.qty, localItem.qty);
                } else {
                  merged.push(localItem);
                }
              });
              return merged;
            });
            showToast('☁️ Tu carrito se ha sincronizado con tu cuenta de Google');
          }
        } catch (err) {
          console.warn('Sync cart error:', err);
        }
      }

      // =======================================================================
      // GOOGLE AUTH
      // =======================================================================
      async function handleGoogleLogin() {
        if (!supabase) {
          setIsConfigOpen(true);
          showToast('Por favor configura tus credenciales de Supabase primero.', 'info');
          return;
        }

        const redirectUrl = window.location.origin + window.location.pathname;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: redirectUrl
          }
        });

        if (error) {
          showToast('Error al conectar con Google: ' + error.message, 'error');
        }
      }

      async function handleLogout() {
        if (supabase) {
          await supabase.auth.signOut();
        }
        setUser(null);
        setIsProfileOpen(false);
        showToast('Has cerrado sesión correctamente.');
      }

      // =======================================================================
      // GESTIÓN DE CARRITO
      // =======================================================================
      function addToCart(product, specificVariant = null) {
        const varName = specificVariant || selectedVariants[product.id] || (product.variants?.[0]?.name);
        const variantObj = (product.variants || []).find(v => v.name === varName);

        if (!variantObj || variantObj.stock <= 0) {
          showToast(`El tono o talla "${varName}" está agotado.`, 'error');
          return;
        }

        const key = `${product.id}_${varName}`;
        const existing = cart.find(i => i.key === key);

        if (existing && existing.qty >= variantObj.stock) {
          showToast(`Solo quedan ${variantObj.stock} unidades disponibles de "${varName}".`, 'error');
          return;
        }

        const unitPrice = product.discount_price ? Number(product.discount_price) : Number(product.price);

        if (existing) {
          setCart(cart.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, {
            key,
            productId: product.id,
            name: product.name,
            variant: varName,
            price: unitPrice,
            qty: 1,
            image: product.image
          }]);
        }

        showToast(`✨ ¡"${product.name}" agregado al carrito!`);
        setIsCartOpen(true);
        if (quickViewProduct) setQuickViewProduct(null);
      }

      function updateCartQty(key, delta) {
        setCart(cart.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            // Verificar stock disponible en producto
            const prod = products.find(p => p.id === item.productId);
            const varObj = prod?.variants?.find(v => v.name === item.variant);
            const maxStock = varObj ? varObj.stock : 99;

            if (newQty > maxStock) {
              showToast(`Stock máximo disponible: ${maxStock} unidades.`, 'info');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      }

      function removeFromCart(key) {
        setCart(cart.filter(i => i.key !== key));
        showToast('Producto retirado del carrito', 'info');
      }

      // Cálculos de Totales
      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const deliveryObj = DELIVERY_OPTIONS.find(d => d.id === customer.delivery) || DELIVERY_OPTIONS[0];
      const total = subtotal + deliveryObj.price;

      // =======================================================================
      // SUBIDA DE COMPROBANTES / IMÁGENES A SUPABASE STORAGE
      // =======================================================================
      async function uploadFileToSupabase(file, folder = 'receipts') {
        if (!supabase) {
          showToast('Conecta Supabase primero para subir imágenes a la nube.', 'error');
          return null;
        }
        setUploading(true);
        try {
          const ext = file.name.split('.').pop();
          const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
          const fileName = `${folder}/${Date.now()}_${cleanName}.${ext}`;

          const { error: uploadError } = await supabase.storage
            .from('kaoj-assets')
            .upload(fileName, file, { cacheControl: '3600', upsert: true });

          if (uploadError) {
            throw uploadError;
          }

          const { data } = supabase.storage.from('kaoj-assets').getPublicUrl(fileName);
          setUploading(false);
          showToast('📸 Imagen subida exitosamente');
          return data.publicUrl;
        } catch (err) {
          setUploading(false);
          showToast('Error al subir imagen: ' + err.message, 'error');
          return null;
        }
      }

      // =======================================================================
      // FINALIZAR PEDIDO (CHECKOUT)
      // =======================================================================
      async function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) return showToast('Tu carrito está vacío', 'error');
        if (!customer.name.trim() || !customer.phone.trim()) {
          return showToast('Por favor ingresa tu nombre y número de celular.', 'error');
        }
        if (!customer.receiptUrl) {
          return showToast('⚠️ Por favor sube la foto de tu comprobante de pago para validar tu orden.', 'error');
        }

        const generatedCode = customerCode || calculateCustomerCode(customer.name, customer.phone);
        const orderCode = `KAOJ-${Math.floor(100000 + Math.random() * 900000)}`;

        const orderData = {
          order_code: orderCode,
          customer_code: generatedCode,
          customer_name: customer.name.trim(),
          customer_phone: customer.phone.trim(),
          customer_id_card: customer.idCard.trim(),
          customer_email: customer.email || user?.email || '',
          user_id: user?.id || null,
          delivery_method: deliveryObj.label,
          delivery_address: customer.address.trim(),
          shipping_cost: deliveryObj.price,
          subtotal: subtotal,
          total: total,
          payment_method: customer.paymentMethod === 'deuna' ? 'Deuna!' : 'Transferencia Bancaria',
          receipt_url: customer.receiptUrl,
          items: cart,
          status: 'pendiente'
        };

        // 1. Guardar en Supabase si está disponible
        if (supabase) {
          try {
            const { error: ordErr } = await supabase.from('kaoj_orders').insert([orderData]);
            if (ordErr) {
              console.warn('Error guardando en Supabase:', ordErr);
            }

            // Descontar inventario en Supabase
            for (const item of cart) {
              const prod = products.find(p => p.id === item.productId);
              if (prod && Array.isArray(prod.variants)) {
                const updatedVariants = prod.variants.map(v =>
                  v.name === item.variant ? { ...v, stock: Math.max(0, v.stock - item.qty) } : v
                );
                await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', prod.id);
              }
            }

            // Limpiar carrito en la nube si está conectado
            if (user) {
              await supabase.from('kaoj_carts').delete().eq('user_id', user.id);
            }
          } catch (err) {
            console.warn('Checkout DB error:', err);
          }
        }

        // 2. Armar mensaje detallado para WhatsApp oficial de Kaoj Store
        const itemsList = cart.map(i => `• ${i.qty}x *${i.name}* (${i.variant}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');
        const paymentLabel = customer.paymentMethod === 'deuna' ? '💜 Deuna!' : '🏦 Transferencia Bancaria';

        const whatsappMsg =
          `✨ *NUEVO PEDIDO KAOJ STORE* ✨\n\n` +
          `📦 *Orden:* ${orderCode}\n` +
          `🏷️ *CÓDIGO ÚNICO DE CLIENTE:* *${generatedCode}*\n` +
          `👤 *Cliente:* ${customer.name}\n` +
          `📱 *Celular:* ${customer.phone}\n` +
          (customer.idCard ? `🪪 *Cédula:* ${customer.idCard}\n` : '') +
          `🚚 *Entrega:* ${deliveryObj.label}\n` +
          (customer.address ? `📍 *Dirección:* ${customer.address}\n` : '') +
          `💳 *Método de Pago:* ${paymentLabel}\n\n` +
          `🛍️ *DETALLE DE PRODUCTOS:*\n${itemsList}\n\n` +
          `💵 *Subtotal:* $${subtotal.toFixed(2)}\n` +
          `🚚 *Envío:* $${deliveryObj.price.toFixed(2)}\n` +
          `💰 *TOTAL PAGADO:* *$${total.toFixed(2)}*\n\n` +
          `📸 *Comprobante de Pago alojado:* \n${customer.receiptUrl}\n\n` +
          `¡Hola! Acabo de realizar este pedido en la web y adjunto mi comprobante para dejar mis productos asegurados. 💅✨`;

        // 3. Abrir WhatsApp
        const cleanNumber = settings.whatsapp_number.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(whatsappMsg)}`, '_blank');

        // 4. Limpiar estado local
        setCart([]);
        setIsCartOpen(false);
        setCustomer(prev => ({ ...prev, receiptUrl: '' }));
        showToast(`🎉 ¡Pedido ${orderCode} generado con éxito! Código: ${generatedCode}`);

        // Recargar inventario
        fetchStoreData();
      }

      // =======================================================================
      // CONSULTAR PEDIDOS POR CÓDIGO ÚNICO DE CLIENTE
      // =======================================================================
      async function handleSearchOrders() {
        if (!trackingCode.trim()) return showToast('Ingresa tu código único o número de celular', 'info');
        setTrackingLoading(true);
        setTrackedOrders(null);

        const cleanInput = trackingCode.trim().toUpperCase();
        const digits = trackingCode.replace(/\D/g, '');

        if (!supabase) {
          // Búsqueda en memoria local si no hay Supabase
          const filtered = orders.filter(o =>
            (o.customer_code && o.customer_code.toUpperCase() === cleanInput) ||
            (o.order_code && o.order_code.toUpperCase() === cleanInput) ||
            (digits && o.customer_phone && o.customer_phone.includes(digits))
          );
          setTrackedOrders(filtered);
          setTrackingLoading(false);
          return;
        }

        try {
          // Búsqueda en Supabase
          let query = supabase.from('kaoj_orders').select('*').order('created_at', { ascending: false });

          // Filtrar por código único, número de orden o teléfono
          const { data, error } = await supabase
            .from('kaoj_orders')
            .select('*')
            .or(`customer_code.ilike.%${cleanInput}%,order_code.ilike.%${cleanInput}%,customer_phone.ilike.%${digits}%`)
            .order('created_at', { ascending: false });

          if (error) throw error;
          setTrackedOrders(data || []);
        } catch (err) {
          showToast('Error al buscar pedidos: ' + err.message, 'error');
        } finally {
          setTrackingLoading(false);
        }
      }

      // =======================================================================
      // ADMINISTRACIÓN: GESTIÓN DE PRODUCTOS E INVENTARIO
      // =======================================================================
      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!newProd.name.trim() || !newProd.price) {
          return showToast('Ingresa al menos el nombre y precio del producto', 'error');
        }

        // Parsear variantes (Formato: "Nombre:Stock, Nombre:Stock")
        const parsedVariants = newProd.variantsText.split(',').map(pair => {
          const parts = pair.split(':');
          const name = (parts[0] || '').trim();
          const stock = parseInt((parts[1] || '0').trim(), 10);
          return { name, stock: isNaN(stock) ? 0 : stock };
        }).filter(v => v.name);

        const prodPayload = {
          name: newProd.name.trim(),
          category: newProd.category,
          price: parseFloat(newProd.price),
          discount_price: newProd.discount_price ? parseFloat(newProd.discount_price) : null,
          image: newProd.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600',
          description: newProd.description.trim(),
          variant_label: newProd.variant_label.trim() || 'Tono / Talla',
          variants: parsedVariants.length > 0 ? parsedVariants : [{ name: 'Único', stock: 5 }],
          is_active: true
        };

        if (supabase) {
          const { data, error } = await supabase.from('kaoj_products').insert([prodPayload]).select();
          if (error) {
            return showToast('Error al crear producto: ' + error.message, 'error');
          }
          if (data && data[0]) {
            setProducts([data[0], ...products]);
          }
        } else {
          // Modo local
          const localNew = { ...prodPayload, id: Date.now() };
          setProducts([localNew, ...products]);
        }

        showToast('✅ Producto agregado al inventario de Supabase');
        setNewProd({
          name: '',
          category: 'Labiales',
          price: '',
          discount_price: '',
          image: '',
          description: '',
          variant_label: 'Tono / Talla',
          variantsText: 'Rosa Nude:5, Rojo Carmesí:4'
        });
      }

      // Actualizar stock rápido de una variante en el panel Admin (+ / -)
      async function handleQuickStockChange(productId, variantName, delta) {
        const prod = products.find(p => p.id === productId);
        if (!prod || !prod.variants) return;

        const updatedVariants = prod.variants.map(v =>
          v.name === variantName ? { ...v, stock: Math.max(0, (v.stock || 0) + delta) } : v
        );

        if (supabase) {
          const { error } = await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', productId);
          if (error) return showToast('Error al actualizar stock: ' + error.message, 'error');
        }

        setProducts(products.map(p => p.id === productId ? { ...p, variants: updatedVariants } : p));
        showToast(`Stock de "${variantName}" ajustado`);
      }

      // Eliminar producto
      async function handleDeleteProduct(productId) {
        if (!confirm('¿Estás segura de eliminar este producto del inventario?')) return;

        if (supabase) {
          const { error } = await supabase.from('kaoj_products').delete().eq('id', productId);
          if (error) return showToast('Error al eliminar: ' + error.message, 'error');
        }

        setProducts(products.filter(p => p.id !== productId));
        showToast('Producto eliminado del inventario', 'info');
      }

      // Guardar edición de producto
      async function handleUpdateProduct(e) {
        e.preventDefault();
        if (!editingProduct) return;

        if (supabase) {
          const { error } = await supabase.from('kaoj_products').update({
            name: editingProduct.name,
            category: editingProduct.category,
            price: parseFloat(editingProduct.price),
            discount_price: editingProduct.discount_price ? parseFloat(editingProduct.discount_price) : null,
            image: editingProduct.image,
            description: editingProduct.description,
            variant_label: editingProduct.variant_label,
            variants: editingProduct.variants
          }).eq('id', editingProduct.id);

          if (error) return showToast('Error actualizando producto: ' + error.message, 'error');
        }

        setProducts(products.map(p => p.id === editingProduct.id ? editingProduct : p));
        setEditingProduct(null);
        showToast('✅ Producto actualizado correctamente');
      }

      // Actualizar estado de orden en Admin
      async function handleOrderStatusChange(orderId, newStatus) {
        if (supabase) {
          const { error } = await supabase.from('kaoj_orders').update({ status: newStatus }).eq('id', orderId);
          if (error) return showToast('Error actualizando estado: ' + error.message, 'error');
        }

        setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast(`Estado cambiado a "${newStatus}"`);
      }

      // Notificar al cliente por WhatsApp del cambio de estado
      function notifyCustomerWhatsApp(order) {
        const statusMap = {
          'pendiente': 'recibido y está pendiente de verificación.',
          'verificado': 'aprobado con éxito y estamos preparando tus productos con amor. 💅✨',
          'en_camino': 'despachado y va en camino a tu dirección. 🚚💨',
          'entregado': 'entregado. ¡Esperamos que disfrutes tus productos! Recuerda etiquetarnos en Instagram. 💖',
          'cancelado': 'cancelado. Por favor contáctanos si tienes alguna duda.'
        };

        const msg =
          `Hola *${order.customer_name}*, te saludamos desde *KAOJ STORE* 💖\n\n` +
          `Te informamos que tu pedido *${order.order_code}* (Código de Cliente: *${order.customer_code}*) ha sido ${statusMap[order.status] || 'actualizado.'}\n\n` +
          `Total: $${Number(order.total).toFixed(2)}\n\n` +
          `¡Gracias por tu confianza! Si tienes cualquier inquietud, estamos para servirte. ✨`;

        const cleanNumber = order.customer_phone.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(msg)}`, '_blank');
      }

      // Guardar Ajustes Generales
      async function handleSaveSettings() {
        if (supabase) {
          const { error } = await supabase.from('kaoj_settings').upsert([settings]);
          if (error) return showToast('Error guardando ajustes: ' + error.message, 'error');
        }
        showToast('⚙️ Configuración de tienda guardada en Supabase');
      }

      // Guardar conexión Supabase desde el asistente
      function handleSaveSupabaseConfig(e) {
        e.preventDefault();
        const trimmedUrl = configInputUrl.trim();
        const trimmedKey = configInputKey.trim();

        if (!trimmedUrl || !trimmedKey) {
          return showToast('Ingresa tanto la URL como la Anon Key de Supabase', 'error');
        }

        try {
          supabase = window.supabase.createClient(trimmedUrl, trimmedKey);
          localStorage.setItem('kaoj_supabase_url', trimmedUrl);
          localStorage.setItem('kaoj_supabase_anon_key', trimmedKey);
          supabaseConfig = { url: trimmedUrl, key: trimmedKey };
          setIsConfigOpen(false);
          showToast('🚀 Conexión con Supabase configurada con éxito');
          fetchStoreData();
        } catch (err) {
          showToast('Error al conectar con Supabase: ' + err.message, 'error');
        }
      }

      // =======================================================================
      // FILTRADO Y BÚSQUEDA DE PRODUCTOS
      // =======================================================================
      const filteredProducts = useMemo(() => {
        let result = [...products];

        // Filtro por categoría
        if (category !== 'Todos') {
          if (category === 'Ofertas') {
            result = result.filter(p => Boolean(p.discount_price));
          } else {
            result = result.filter(p => p.category === category);
          }
        }

        // Filtro por texto de búsqueda
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          result = result.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.description?.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q)
          );
        }

        // Ordenamiento
        if (sortBy === 'precio_menor') {
          result.sort((a, b) => (a.discount_price || a.price) - (b.discount_price || b.price));
        } else if (sortBy === 'precio_mayor') {
          result.sort((a, b) => (b.discount_price || b.price) - (a.discount_price || a.price));
        } else if (sortBy === 'ofertas') {
          result.sort((a, b) => (b.discount_price ? 1 : 0) - (a.discount_price ? 1 : 0));
        }

        return result;
      }, [products, category, searchQuery, sortBy]);

      // Filtrado de pedidos en Admin
      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          const matchStatus = adminOrderFilter === 'todos' || o.status === adminOrderFilter;
          const q = adminSearch.toLowerCase().trim();
          const matchSearch = !q ||
            o.order_code?.toLowerCase().includes(q) ||
            o.customer_code?.toLowerCase().includes(q) ||
            o.customer_name?.toLowerCase().includes(q) ||
            o.customer_phone?.includes(q);
          return matchStatus && matchSearch;
        });
      }, [orders, adminOrderFilter, adminSearch]);

      // =======================================================================
      // RENDERIZADO
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col bg-[#FDFAFC]">

          {/* BANNER ANUNCIO SUPERIOR */}
          <div className="bg-gradient-to-r from-[#FF2E93] via-[#E0157A] to-[#B80D61] text-white text-xs py-2 px-4 text-center font-medium tracking-wide shadow-sm flex items-center justify-center gap-2">
            <span>✨</span>
            <p className="truncate max-w-4xl">{settings.banner_message}</p>
            <span>✨</span>
          </div>

          {/* NAVBAR / HEADER */}
          <header className="bg-white/95 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

              {/* LOGO KAOJ STORE */}
              <div
                onClick={() => { setIsAdmin(false); setCategory('Todos'); }}
                className="cursor-pointer select-none text-left group"
              >
                <div className="flex items-center gap-1.5">
                  <h1 className="font-serif-kaoj text-3xl sm:text-4xl font-extrabold text-[#FF2E93] tracking-wider leading-none group-hover:scale-[1.02] transition">
                    KAOJ
                  </h1>
                  <span className="text-xl">💅</span>
                </div>
                <span className="block text-[10px] sm:text-[11px] tracking-[0.45em] text-gray-700 font-bold mt-0.5">
                  STORE
                </span>
              </div>

              {/* BARRA DE BÚSQUEDA EN HEADER (PANTALLAS MEDIANAS EN ADELANTE) */}
              {!isAdmin && (
                <div className="hidden md:flex flex-1 max-w-md mx-4 relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                    🔍
                  </span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Buscar labial, skincare, blusa, vestido..."
                    className="w-full pl-10 pr-8 py-2 text-xs sm:text-sm bg-pink-50/50 border border-pink-200 rounded-full focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#FF2E93] transition"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}

                    >
                      ✕
                    </button>

              )}

              {/* ACCIONES Y BOTONES DEL HEADER */}
              <div className="flex items-center gap-2 sm:gap-3">

                {/* BOTÓN RASTREAR PEDIDO / CONSULTAR CÓDIGO */}
                {!isAdmin && (
                  <button

                {/* BOTÓN INICIAR SESIÓN CON GOOGLE / PERFIL */}
                {!user ? (

                  >

                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>

                      </span>
                      {customerCode && (

                          {customerCode}
                        </span>
                      )}
                    </button>

                    {/* MENÚ DESPLEGABLE DE PERFIL */}
                    {isProfileOpen && (
                      <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-pink-100 p-4 z-50 text-xs space-y-3">

                              🏷️ Código Único: {customerCode}
                            </div>
                          )}
                        </div>
                        <div className="space-y-1 text-gray-600">
                          <p className="text-[11px] text-green-700 font-semibold flex items-center gap-1">
                            <span>☁️</span> Carrito sincronizado en la nube
                          </p>
                          <button
                            onClick={() => { setIsProfileOpen(false); setIsTrackingOpen(true); }}

                            📦 Ver mi historial de pedidos
                          </button>
                        </div>
                        <button

                        setIsAdmin(true);

                        showToast('PIN incorrecto', 'error');
                      }

                  }}
                  className={`text-xs px-3 py-2 rounded-full border transition font-medium ${

                >
                  {isAdmin ? '← Tienda' : '⚙️ Admin'}
                </button>

                {/* BOTÓN CARRITO CON CONTADOR */}
                <button
                  onClick={() => setIsCartOpen(true)}

            {/* BARRA DE CATEGORÍAS HORIZONTAL (SOLO EN TIENDA) */}
            {!isAdmin && (
              <div className="border-t border-pink-50 bg-[#FFFBFD]">

                  <div className="flex gap-2">
                    {CATEGORIES.map(cat => {
                      const isSelected = category === cat;

                        'Todos': '✨',

                              }}
                              className="text-[#FF2E93] font-bold underline"
                            >
                              Copiar Número de Cuenta
                            </button>
                          </div>
                        </div>
                      )}

                      {/* SUBIDA DEL COMPROBANTE A SUPABASE */}
                      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 space-y-2">
                        <p className="font-bold text-amber-900">
                          📸 Sube la captura de tu pago o transferencia para asegurar tus productos:
                        </p>
                        <input
                          type="file"
                          accept="image/*,application/pdf"
                          onChange={async e => {
                            if (e.target.files[0]) {
                              const url = await uploadFileToSupabase(e.target.files[0], 'receipts');
                              if (url) setCustomer({ ...customer, receiptUrl: url });
                            }
                          }}
                          className="w-full text-xs text-amber-900"
                        />
                        {uploading && <p className="text-[#FF2E93] font-bold">Subiendo a Supabase Storage...</p>}
                        {customer.receiptUrl && (
                          <div className="flex items-center gap-2 pt-1 text-green-700 font-bold">
                            <span>✅ Comprobante cargado correctamente</span>
                            <button
                              type="button"
                              onClick={() => setPreviewReceiptUrl(customer.receiptUrl)}
                              className="text-xs underline text-[#FF2E93]"
                            >
                              Ver
                            </button>
                          </div>
                        )}
                      </div>

                      {/* TOTALES */}
                      <div className="border-t pt-3 space-y-1">
                        <div className="flex justify-between text-gray-600">
                          <span>Subtotal:</span>
                          <span>${subtotal.toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between text-gray-600">
                          <span>Envío / Entrega:</span>
                          <span>{deliveryObj.price === 0 ? 'GRATIS' : `$${deliveryObj.price.toFixed(2)}`}</span>
                        </div>
                        <div className="flex justify-between text-base font-black text-gray-900 pt-1 border-t">
                          <span>Total a Pagar:</span>
                          <span className="text-[#FF2E93]">${total.toFixed(2)}</span>
                        </div>
                      </div>

                      <button
                        type="submit"
                        disabled={uploading}
                        className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3.5 rounded-xl font-bold text-sm shadow-md transition active:scale-95"
                      >
                        Confirmar y Enviar Pedido a WhatsApp 💅✨
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: VISTA RÁPIDA DE PRODUCTO */}
          {quickViewProduct && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-pink-100 flex flex-col md:flex-row relative">
                <button
                  onClick={() => setQuickViewProduct(null)}
                  className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 hover:bg-white flex items-center justify-center font-bold text-gray-600 shadow-md z-10"
                >
                  ✕
                </button>

                <div className="md:w-1/2 h-64 md:h-auto bg-pink-50 relative">
                  <img
                    src={quickViewProduct.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'}
                    alt={quickViewProduct.name}
                    className="w-full h-full object-cover"
                  />
                  <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-xs px-2.5 py-1 rounded-full text-xs font-bold text-[#FF2E93]">
                    {quickViewProduct.category}
                  </span>
                </div>

                <div className="p-6 md:w-1/2 flex flex-col justify-between space-y-4">
                  <div>
                    <h3 className="font-bold text-xl text-gray-900 leading-snug">{quickViewProduct.name}</h3>
                    <p className="text-xs text-gray-500 mt-2">{quickViewProduct.description}</p>

                    <div className="mt-4 flex items-baseline gap-2">
                      {quickViewProduct.discount_price ? (
                        <>
                          <span className="text-2xl font-black text-[#FF2E93]">
                            ${Number(quickViewProduct.discount_price).toFixed(2)}
                          </span>
                          <span className="line-through text-gray-400 text-sm">
                            ${Number(quickViewProduct.price).toFixed(2)}
                          </span>
                        </>
                      ) : (
                        <span className="text-2xl font-black text-gray-900">
                          ${Number(quickViewProduct.price).toFixed(2)}
                        </span>
                      )}
                    </div>

                    <div className="mt-4">
                      <span className="text-xs font-bold text-gray-700 block mb-1.5">
                        Selecciona {quickViewProduct.variant_label || 'Tono / Talla'}:
                      </span>
                      <div className="flex flex-wrap gap-1.5">
                        {(quickViewProduct.variants || []).map(v => {
                          const isCurrent = (selectedVariants[quickViewProduct.id] || quickViewProduct.variants[0]?.name) === v.name;
                          return (
                            <button
                              key={v.name}
                              disabled={v.stock <= 0}
                              onClick={() => setSelectedVariants({ ...selectedVariants, [quickViewProduct.id]: v.name })}
                              className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                                isCurrent
                                  ? 'bg-[#FF2E93] text-white border-[#FF2E93]'
                                  : v.stock <= 0
                                  ? 'bg-gray-100 text-gray-400 border-gray-200 line-through cursor-not-allowed'
                                  : 'bg-white text-gray-700 border-gray-200 hover:border-pink-300'
                              }`}
                            >
                              {v.name} ({v.stock})
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => addToCart(quickViewProduct)}
                    className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3 rounded-xl font-bold text-sm shadow-md transition"
                  >
                    Agregar al Carrito 🛍️
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: RASTREO DE PEDIDOS POR CÓDIGO ÚNICO DE CLIENTE */}
          {isTrackingOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-pink-100 relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setIsTrackingOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 font-bold text-xl"
                >
                  ✕
                </button>

                <div>
                  <h3 className="font-serif-kaoj text-2xl font-bold text-gray-900">
                    🏷️ Consulta tus Pedidos
                  </h3>
                  <p className="text-xs text-gray-500 mt-1">
                    Ingresa tu <b>Código Único de Cliente</b> (ej. J4567), número de celular o código de orden (ej. KAOJ-123456).
                  </p>
                </div>

                <div className="flex gap-2">
                  <input
                    type="text"
                    value={trackingCode}
                    onChange={e => setTrackingCode(e.target.value)}
                    placeholder="Ej. J4567 o 0991234567"
                    className="flex-1 border rounded-xl p-2.5 text-xs outline-none focus:ring-1 focus:ring-[#FF2E93] uppercase font-mono font-bold"
                  />
                  <button
                    onClick={handleSearchOrders}
                    disabled={trackingLoading}
                    className="bg-[#FF2E93] hover:bg-[#e0157a] text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-xs transition"
                  >
                    {trackingLoading ? 'Buscando...' : 'Buscar'}
                  </button>
                </div>

                {/* RESULTADOS DEL RASTREO */}
                {trackedOrders && (
                  <div className="space-y-3 pt-2">
                    {trackedOrders.length === 0 ? (
                      <p className="text-xs text-gray-500 text-center py-6">
                        No se encontraron pedidos registrados con ese código. Verifica que esté bien escrito o consulta por WhatsApp.
                      </p>
                    ) : (
                      trackedOrders.map(order => (
                        <div key={order.id || order.order_code} className="border rounded-2xl p-4 text-xs space-y-2 bg-pink-50/30">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-[#FF2E93] text-sm">{order.order_code}</span>
                            <span className={`px-2.5 py-0.5 rounded-full font-bold text-[10px] uppercase ${
                              order.status === 'entregado' ? 'bg-green-100 text-green-700' :
                              order.status === 'verificado' ? 'bg-blue-100 text-blue-700' :
                              order.status === 'en_camino' ? 'bg-purple-100 text-purple-700' :
                              'bg-amber-100 text-amber-700'
                            }`}>
                              {order.status || 'Pendiente'}
                            </span>
                          </div>
                          <p className="text-gray-600">Cliente: <b>{order.customer_name}</b> | Código: <b>{order.customer_code}</b></p>
                          <p className="text-gray-500">Entrega: {order.delivery_method}</p>
                          <div className="border-t pt-1.5 flex justify-between font-bold">
                            <span>Total:</span>
                            <span className="text-[#FF2E93]">${Number(order.total).toFixed(2)}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: VER COMPROBANTE EN PANTALLA COMPLETA */}
          {previewReceiptUrl && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-4 relative space-y-3">
                <div className="flex justify-between items-center">
                  <h4 className="font-bold text-sm text-gray-900">Comprobante de Pago</h4>
                  <button onClick={() => setPreviewReceiptUrl(null)} className="font-bold text-gray-500 text-lg">✕</button>
                </div>
                <img src={previewReceiptUrl} alt="Comprobante" className="w-full max-h-[70vh] object-contain rounded-xl border bg-gray-50" />
                <a
                  href={previewReceiptUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="block text-center text-xs text-[#FF2E93] font-bold underline"
                >
                  Abrir imagen original en nueva pestaña ↗
                </a>
              </div>
            </div>
          )}

          {/* MODAL: EDITAR PRODUCTO EN ADMIN */}
          {editingProduct && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setEditingProduct(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 font-bold text-xl"
                >
                  ✕
                </button>

                <h3 className="font-bold text-lg text-gray-900">✏️ Editar Producto en Supabase</h3>

                <form onSubmit={handleUpdateProduct} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-700 block mb-1">Nombre</label>
                    <input
                      required
                      value={editingProduct.name}
                      onChange={e => setEditingProduct({ ...editingProduct, name: e.target.value })}
                      className="w-full border rounded-xl p-2.5 outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-gray-700 block mb-1">Precio Normal ($)</label>
                      <input
                        required
                        type="number"
                        step="0.01"
                        value={editingProduct.price}
                        onChange={e => setEditingProduct({ ...editingProduct, price: e.target.value })}
                        className="w-full border rounded-xl p-2.5 outline-none"
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-gray-700 block mb-1">Precio Oferta ($)</label>
                      <input
                        type="number"
                        step="0.01"
                        value={editingProduct.discount_price || ''}
                        onChange={e => setEditingProduct({ ...editingProduct, discount_price: e.target.value || null })}
                        className="w-full border rounded-xl p-2.5 outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold text-gray-700 block mb-1">URL de Imagen</label>
                    <input
                      value={editingProduct.image}
                      onChange={e => setEditingProduct({ ...editingProduct, image: e.target.value })}
                      className="w-full border rounded-xl p-2.5 outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-gray-700 block mb-1">Descripción</label>
                    <textarea
                      rows="3"
                      value={editingProduct.description}
                      onChange={e => setEditingProduct({ ...editingProduct, description: e.target.value })}
                      className="w-full border rounded-xl p-2.5 outline-none resize-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3 rounded-xl font-bold text-xs shadow-sm transition"
                  >
                    Guardar Cambios
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONFIGURADOR DE SUPABASE (URL Y ANON KEY) */}
          {isConfigOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                <button
                  onClick={() => setIsConfigOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 font-bold text-xl"
                >
                  ✕
                </button>

                <div>
                  <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2">
                    <span>⚙️</span> Conectar Base de Datos Supabase
                  </h3>
                  <p className="text-xs text-gray-500 mt-1">
                    Copia tus claves desde <b>Supabase Dashboard -> Project Settings -> API</b>. Se guardarán en tu navegador para sincronizar todo en vivo.
                  </p>
                </div>

                <form onSubmit={handleSaveSupabaseConfig} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">Project URL:</label>
                    <input
                      required
                      placeholder="https://xyzcompany.supabase.co"
                      value={configInputUrl}
                      onChange={e => setConfigInputUrl(e.target.value)}
                      className="w-full border rounded-xl p-2.5 outline-none font-mono text-xs"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-gray-700 block mb-1">Anon / Public Key:</label>
                    <input
                      required
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      value={configInputKey}
                      onChange={e => setConfigInputKey(e.target.value)}
                      className="w-full border rounded-xl p-2.5 outline-none font-mono text-xs"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3 rounded-xl font-bold text-xs shadow-md transition"
                  >
                    Guardar y Conectar Supabase 🚀
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FLOATING WHATSAPP BUTTON */}
          <a
            href={`https://wa.me/${settings.whatsapp_number.replace(/\D/g, '')}?text=${encodeURIComponent('¡Hola Kaoj Store! Me gustaría consultar sobre sus productos y catálogo. 💅✨')}`}
            target="_blank"
            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition duration-200"
            title="Chatea con nosotras por WhatsApp"
          >
            <span className="text-2xl">💬</span>
          </a>

          {/* TOAST NOTIFICATION CONTAINER */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2 bg-gray-900 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl border border-gray-800 animate-bounce">
              <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
              <p className="font-semibold">{toast.message}</p>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-pink-100 mt-16 text-xs text-gray-500 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-2">
                <h4 className="font-serif-kaoj text-2xl font-black text-[#FF2E93]">KAOJ STORE</h4>
                <p className="text-gray-500">
                  Maquillaje, skincare dermatológico y moda con glamour. Entregas personales en Portoviejo, ULEAM Manta, San Jacinto y envíos a todo el Ecuador.
                </p>
              </div>

              <div>
                <h5 className="font-bold text-gray-900 mb-2">Entregas & Retiros</h5>
                <ul className="space-y-1">
                  <li>📍 Portoviejo (Retiro Gratis)</li>
                  <li>📍 ULEAM Manta (Retiro Gratis)</li>
                  <li>📍 San Jacinto (Retiro Gratis)</li>
                  <li>🚚 Servientrega Nacional</li>
                </ul>
              </div>

              <div>
                <h5 className="font-bold text-gray-900 mb-2">Métodos de Pago</h5>
                <ul className="space-y-1">
                  <li>💜 Deuna! (App oficial)</li>
                  <li>🏦 Banco Guayaquil (Ahorros)</li>
                  <li>🏦 Banco Pichincha (Ahorros)</li>
                  <li>🏷️ Código Único de Cliente VIP</li>
                </ul>
              </div>

              <div className="space-y-2">
                <h5 className="font-bold text-gray-900">Contacto & Ayuda</h5>
                <p>WhatsApp: <b>+{settings.whatsapp_number}</b></p>
                <p>Correo: <b>{settings.email_contact}</b></p>
                <button
                  onClick={() => setIsConfigOpen(true)}
                  className="text-[11px] text-[#FF2E93] underline block pt-1"
                >
                  ⚙️ Configuración Supabase
                </button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 mt-8 border-t border-pink-50 text-center flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 KAOJ STORE. Todos los derechos reservados.</p>
              <p className="text-[11px] text-gray-400">
                Diseñado para GitHub Pages y Supabase Database 💅
              </p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
