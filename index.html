    function generateCustomerCode(name, phone) {
      if (!name || !phone) return '';
      const cleanName = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const match = cleanName.match(/[a-zA-Z]/);
      const firstLetter = match ? match[0].toUpperCase() : 'K';
      const digits = phone.replace(/\D/g, '');
      if (digits.length < 4) return '';
      const last4 = digits.slice(-4);
      return `${firstLetter}${last4}`;
    }

          .or(`user_id.eq.${googleUser.id},email.eq.${googleEmail}`)
          .maybeSingle();

        if (existingCust && existingCust.customer_code) {
          // Cliente ya tiene teléfono y código único permanente
          setCustomerProfile(existingCust);
          setCustomer(prev => ({
            ...prev,
            name: existingCust.name || googleName,
            phone: existingCust.phone || '',
            email: googleEmail,
            address: existingCust.address || prev.address
          }));
          showToast(`Bienvenida de nuevo, ${googleName.split(' ')[0]}. Código: ${existingCust.customer_code}`);
        } else {
          // Primer ingreso con Google: solicitar número de celular para generar código permanente
          setCustomer(prev => ({ ...prev, name: googleName, email: googleEmail }));
          setShowPhonePromptModal(true);
        }

        // Cargar y sincronizar carrito de la nube
        loadCloudCart(googleUser.id);
      }

      // Guardar el número de celular del cliente y asociarlo de por vida a Google
      async function handleSavePhoneForGoogle(e) {
        e.preventDefault();
        const cleanDigits = phoneInputForGoogle.replace(/\D/g, '');
        if (cleanDigits.length < 9) {
          return showToast('Ingresa un número de celular válido de 10 dígitos', 'error');
        }

        const googleName = user?.user_metadata?.full_name || customer.name || 'Cliente';
        const googleEmail = user?.email || '';
        const code = generateCustomerCode(googleName, cleanDigits);

        const newProfile = {
          user_id: user?.id,
          name: googleName,
          phone: cleanDigits,
          email: googleEmail,
          customer_code: code,
          points: 0
        };

        const { data, error } = await supabase.from('kaoj_customers').upsert(newProfile, { onConflict: 'customer_code' }).select().single();

        if (error) {
          return showToast('Error vinculando cuenta: ' + error.message, 'error');
        }

        setCustomerProfile(data || newProfile);
        setCustomer(prev => ({ ...prev, phone: cleanDigits, name: googleName }));
        setShowPhonePromptModal(false);
        showToast(`Tu Código Único permanente es [${code}]. Ha quedado vinculado a tu cuenta de Google.`);
      }

      // Iniciar sesión con Google
      async function handleGoogleSignIn() {
        const redirectUrl = window.location.origin + window.location.pathname;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectUrl }
        });
        if (error) showToast('Error al conectar con Google: ' + error.message, 'error');
      }

      async function handleLogout() {
        await supabase.auth.signOut();
        setUser(null);
        setCustomerProfile(null);
        setIsProfileOpen(false);
        showToast('Sesión cerrada correctamente');
      }

      // =======================================================================
      // SINCRONIZACIÓN DE CARRITO EN SUPABASE (kaoj_carts)
      // =======================================================================
      useEffect(() => {
        try {
          localStorage.setItem('kaoj_cart', JSON.stringify(cart));
        } catch (e) {}

        if (user) {
          supabase.from('kaoj_carts').upsert({
            user_id: user.id,
            customer_code: customerProfile?.customer_code || '',
            items: cart,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
        }
      }, [cart, user, customerProfile]);

      async function loadCloudCart(userId) {
        try {
          const { data } = await supabase.from('kaoj_carts').select('items').eq('user_id', userId).single();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            setCart(prevCart => {
              if (prevCart.length === 0) return data.items;
              const merged = [...data.items];
              prevCart.forEach(localItem => {
                const existing = merged.find(i => i.key === localItem.key);
                if (existing) {
                  existing.qty = Math.max(existing.qty, localItem.qty);
                } else {
                  merged.push(localItem);
                }
              });
              return merged;
            });
            showToast('Carrito sincronizado desde la nube');
          }
        } catch (err) {}
      }

      // =======================================================================
      // GESTIÓN DE CARRITO
      // =======================================================================
      function addToCart(product, specificVariant = null) {
        const activeInfo = activeVariants[product.id];
        const varName = specificVariant || activeInfo?.variantName || (product.variants?.[0]?.name);
        const variantObj = (product.variants || []).find(v => v.name === varName);

        if (!variantObj || variantObj.stock <= 0) {
          return showToast(`"${varName}" no disponible actualmente.`, 'error');
        }

        const key = `${product.id}_${varName}`;
        const existing = cart.find(i => i.key === key);

        if (existing && existing.qty >= variantObj.stock) {
          return showToast(`Stock máximo disponible: ${variantObj.stock} unidades.`, 'info');
        }

        const unitPrice = product.discount_price ? Number(product.discount_price) : Number(product.price);
        const itemImage = variantObj.image || product.image;

        if (existing) {
          setCart(cart.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, {
            key,
            productId: product.id,
            name: product.name,
            variant: varName,
            price: unitPrice,
            qty: 1,
            image: itemImage
          }]);
        }

        showToast(`"${product.name}" agregado al carrito`);
        setIsCartOpen(true);
        if (quickViewProduct) setQuickViewProduct(null);
      }

      function updateCartQty(key, delta) {
        setCart(cart.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            const prod = products.find(p => p.id === item.productId);
            const varObj = prod?.variants?.find(v => v.name === item.variant);
            const maxStock = varObj ? varObj.stock : 99;

            if (newQty > maxStock) {
              showToast(`Stock máximo: ${maxStock}`, 'info');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      }

      function removeFromCart(key) {
        setCart(cart.filter(i => i.key !== key));
      }

      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const deliveryObj = DELIVERY_OPTIONS.find(d => d.id === customer.delivery) || DELIVERY_OPTIONS[0];
      const total = subtotal + deliveryObj.price;

      // Código de cliente activo (permanente o generado en tiempo real)
      const activeCustomerCode = customerProfile?.customer_code || generateCustomerCode(customer.name, customer.phone);

      // =======================================================================
      // FINALIZAR PEDIDO (CHECKOUT)
      // =======================================================================
      async function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) return showToast('El carrito está vacío', 'error');
        if (!customer.name.trim() || !customer.phone.trim()) {
          return showToast('Ingresa tu nombre y celular para generar tu código.', 'error');
        }

        if (customer.paymentMethod !== 'payphone' && !customer.receiptUrl) {
          return showToast('Sube el comprobante de transferencia para validar tu pedido.', 'error');
        }

        const orderCode = `KAOJ-${Math.floor(100000 + Math.random() * 900000)}`;

        const orderData = {
          order_code: orderCode,
          customer_code: activeCustomerCode,
          customer_name: customer.name.trim(),
          customer_phone: customer.phone.trim(),
          customer_id_card: customer.idCard.trim(),
          customer_email: customer.email || user?.email || '',
          user_id: user?.id || null,
          delivery_method: deliveryObj.label,
          delivery_address: customer.address.trim(),
          shipping_cost: deliveryObj.price,
          subtotal: subtotal,
          total: total,
          payment_method:
            customer.paymentMethod === 'deuna' ? 'Deuna!' :
            customer.paymentMethod === 'payphone' ? 'Payphone (Tarjeta)' : 'Transferencia Bancaria',
          receipt_url: customer.receiptUrl || (customer.payphoneRef ? `Payphone Ref: ${customer.payphoneRef}` : ''),
          items: cart,
          status: 'pendiente'
        };

        try {
          await supabase.from('kaoj_orders').insert([orderData]);

          // Descontar inventario en Supabase
          for (const item of cart) {
            const prod = products.find(p => p.id === item.productId);
            if (prod && Array.isArray(prod.variants)) {
              const updatedVariants = prod.variants.map(v =>
                v.name === item.variant ? { ...v, stock: Math.max(0, v.stock - item.qty) } : v
              );
              await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', prod.id);
            }
          }

          if (user) {
            await supabase.from('kaoj_carts').delete().eq('user_id', user.id);
          }
        } catch (err) {}

        // Enviar a WhatsApp oficial 593963073456
        const itemsList = cart.map(i => `• ${i.qty}x *${i.name}* (${i.variant}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');
        const paymentLabel =
          customer.paymentMethod === 'deuna' ? 'Deuna!' :
          customer.paymentMethod === 'payphone' ? 'Tarjeta (Payphone)' : 'Transferencia Bancaria';

        const whatsappMsg =
          `*NUEVO PEDIDO KAOJ STORE*\n\n` +
          `*Orden:* ${orderCode}\n` +
          `*Código Único de Cliente:* *${activeCustomerCode}*\n` +
          `*Cliente:* ${customer.name}\n` +
          `*Celular:* ${customer.phone}\n` +
          (customer.idCard ? `*Cédula:* ${customer.idCard}\n` : '') +
          `*Entrega:* ${deliveryObj.label}\n` +
          (customer.address ? `*Dirección:* ${customer.address}\n` : '') +
          `*Método de Pago:* ${paymentLabel}\n\n` +
          `*PRODUCTOS:*\n${itemsList}\n\n` +
          `*Subtotal:* $${subtotal.toFixed(2)}\n` +
          `*Envío:* $${deliveryObj.price.toFixed(2)}\n` +
          `*TOTAL PAGADO:* *$${total.toFixed(2)}*\n\n` +
          (customer.receiptUrl ? `*Comprobante:* \n${customer.receiptUrl}\n\n` : '') +
          `Hola Kaoj Store, acabo de enviar mi pedido por la web.`;

        window.open(`https://wa.me/593963073456?text=${encodeURIComponent(whatsappMsg)}`, '_blank');

        setCart([]);
        setIsCartOpen(false);
        setCustomer(prev => ({ ...prev, receiptUrl: '', payphoneRef: '' }));
        showToast(`Pedido ${orderCode} registrado con éxito.`);
        fetchInitialData();
      }

      // =======================================================================
      // SUBIDA DE ARCHIVOS A SUPABASE STORAGE
      // =======================================================================
      async function uploadFileToSupabase(file, folder = 'products') {
        setUploading(true);
        try {
          const ext = file.name.split('.').pop();
          const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
          const fileName = `${folder}/${Date.now()}_${cleanName}.${ext}`;

          const { error: uploadError } = await supabase.storage
            .from('kaoj-assets')
            .upload(fileName, file, { cacheControl: '3600', upsert: true });

          if (uploadError) throw uploadError;

          const { data } = supabase.storage.from('kaoj-assets').getPublicUrl(fileName);
          setUploading(false);
          showToast('Imagen cargada');
          return data.publicUrl;
        } catch (err) {
          setUploading(false);
          showToast('Error cargando imagen: ' + err.message, 'error');
          return null;
        }
      }

      // =======================================================================
      // ADMINISTRADOR: EDICIÓN COMPLETA Y FUNCIONAL DE PRODUCTOS
      // =======================================================================
      async function handleSaveEditedProduct(e) {
        e.preventDefault();
        if (!editingProduct) return;

        setUploading(true);
        try {
          const { error } = await supabase
            .from('kaoj_products')
            .update({
              name: editingProduct.name.trim(),
              section: editingProduct.section,
              category: editingProduct.category,
              price: parseFloat(editingProduct.price),
              discount_price: editingProduct.discount_price ? parseFloat(editingProduct.discount_price) : null,
              image: editingProduct.image,
              description: editingProduct.description,
              variant_label: editingProduct.variant_label,
              variants: editingProduct.variants
            })
            .eq('id', editingProduct.id);

          if (error) throw error;

          setProducts(products.map(p => p.id === editingProduct.id ? editingProduct : p));
          setEditingProduct(null);
          setUploading(false);
          showToast('Producto actualizado exitosamente en Supabase');
        } catch (err) {
          setUploading(false);
          showToast('Error al actualizar producto: ' + err.message, 'error');
        }
      }

      // Crear nuevo producto con soporte para fotos por variante
      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!newProd.name.trim() || !newProd.price) {
          return showToast('Ingresa nombre y precio', 'error');
        }

        const prodPayload = {
          name: newProd.name.trim(),
          section: newProd.section,
          category: newProd.category,
          price: parseFloat(newProd.price),
          discount_price: newProd.discount_price ? parseFloat(newProd.discount_price) : null,
          image: newProd.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600',
          description: newProd.description.trim(),
          variant_label: newProd.variant_label.trim() || 'Tono / Talla',
          variants: newProd.variants.length > 0 ? newProd.variants : [{ name: 'Único', stock: 5, image: '' }],
          is_active: true
        };

        const { data, error } = await supabase.from('kaoj_products').insert([prodPayload]).select();
        if (error) return showToast('Error al crear: ' + error.message, 'error');

        if (data && data[0]) setProducts([data[0], ...products]);
        showToast('Producto agregado al catálogo');
        setNewProd({
          name: '', section: 'MAQUILLAJES', category: 'Labiales',
          price: '', discount_price: '', image: '', description: '',
          variant_label: 'Tono / Talla',
          variants: [{ name: '01', stock: 5, image: '' }]
        });
      }

      async function handleDeleteProduct(productId) {
        if (!confirm('¿Eliminar este producto definitivamente del inventario?')) return;
        await supabase.from('kaoj_products').delete().eq('id', productId);
        setProducts(products.filter(p => p.id !== productId));
        showToast('Producto eliminado');
      }

      async function handleQuickStockChange(productId, variantName, delta) {
        const prod = products.find(p => p.id === productId);
        if (!prod || !prod.variants) return;

        const updatedVariants = prod.variants.map(v =>
          v.name === variantName ? { ...v, stock: Math.max(0, (v.stock || 0) + delta) } : v
        );

        await supabase.from('kaoj_products').update({ variants: updatedVariants }).eq('id', productId);
        setProducts(products.map(p => p.id === productId ? { ...p, variants: updatedVariants } : p));
        showToast(`Stock de "${variantName}" actualizado`);
      }

      // =======================================================================
      // FILTRADO DE PRODUCTOS
      // =======================================================================
      const filteredProducts = useMemo(() => {
        let result = [...products];

        if (selectedSection !== 'TODOS') {
          if (selectedSection === 'OFERTAS') {
            result = result.filter(p => Boolean(p.discount_price));
          } else {
            result = result.filter(p => (p.section || '').toUpperCase() === selectedSection);
          }
        }

        if (selectedSubcategory !== 'TODOS' && selectedSection !== 'OFERTAS') {
          result = result.filter(p => (p.category || '').toLowerCase() === selectedSubcategory.toLowerCase());
        }

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          result = result.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.description?.toLowerCase().includes(q) ||
            p.category?.toLowerCase().includes(q) ||
            p.section?.toLowerCase().includes(q)
          );
        }

        if (sortBy === 'precio_menor') {
          result.sort((a, b) => (a.discount_price || a.price) - (b.discount_price || b.price));
        } else if (sortBy === 'precio_mayor') {
          result.sort((a, b) => (b.discount_price || b.price) - (a.discount_price || a.price));
        } else if (sortBy === 'ofertas') {
          result.sort((a, b) => (b.discount_price ? 1 : 0) - (a.discount_price ? 1 : 0));
        }

        return result;
      }, [products, selectedSection, selectedSubcategory, searchQuery, sortBy]);

      // Métricas ejecutivas para el administrador
      const metrics = useMemo(() => {
        const totalSales = orders.reduce((sum, o) => sum + Number(o.total || 0), 0);
        const pendingCount = orders.filter(o => o.status === 'pendiente').length;
        const criticalStockCount = products.filter(p =>
          (p.variants || []).some(v => v.stock <= 2)
        ).length;

        // Distribución por sección
        const secCounts = { MAQUILLAJES: 0, ACCESORIOS: 0, ROPA: 0 };
        products.forEach(p => {
          const sec = (p.section || 'MAQUILLAJES').toUpperCase();
          if (secCounts[sec] !== undefined) secCounts[sec]++;
          else secCounts[sec] = 1;
        });

        return { totalSales, pendingCount, criticalStockCount, secCounts };
      }, [orders, products]);

      // =======================================================================
      // RENDERIZADO
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col bg-[#FAFAFC] text-zinc-900">

          {/* BARRA SUPERIOR MINIMALISTA */}
          <div className="bg-zinc-900 text-zinc-200 text-xs py-2 px-4 text-center font-medium tracking-wider flex items-center justify-center gap-3">
            <span className="max-w-2xl truncate">{settings.banner_message}</span>
            {customerProfile && (
              <span className="hidden sm:inline bg-zinc-800 text-[#FF2E93] text-[11px] font-bold px-2 py-0.5 rounded-full border border-zinc-700">
                VIP: {customerProfile.customer_code}
              </span>
            )}
          </div>

          {/* NAVBAR / HEADER */}
          <header className="bg-white/95 backdrop-blur-md border-b border-zinc-200/80 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">

              {/* LOGOTIPO KAOJ STORE */}
              <div
                onClick={() => { setIsAdmin(false); setSelectedSection('TODOS'); setSelectedSubcategory('TODOS'); }}
                className="cursor-pointer select-none text-left group"
              >
                <h1 className="font-serif-kaoj text-2xl sm:text-3xl font-extrabold text-[#FF2E93] tracking-widest leading-none">
                  KAOJ
                </h1>
                <span className="block text-[9px] sm:text-[10px] tracking-[0.45em] text-zinc-700 font-bold mt-0.5">
                  STORE
                </span>
              </div>

              {/* BÚSQUEDA MINIMALISTA */}
              {!isAdmin && (
                <div className="hidden md:flex flex-1 max-w-md mx-4 relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                    <Icon.Search className="w-4 h-4" />
                  </span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Buscar labial, gloss, blusa, vestido..."
                    className="w-full pl-10 pr-8 py-2 text-xs bg-zinc-50 border border-zinc-200 rounded-full focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#FF2E93] transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-zinc-400">
                      <Icon.Close className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>
              )}

              {/* ACCIONES DEL HEADER: RASTREO, GOOGLE LOGIN & CARRITO */}
              <div className="flex items-center gap-2 sm:gap-3">

                {/* BOTÓN RASTREO DE PEDIDOS */}
                {!isAdmin && (
                  <button
                    onClick={() => setIsTrackingOpen(true)}
                    className="text-xs px-3 py-2 rounded-full border border-zinc-200 hover:border-[#FF2E93] hover:bg-pink-50/50 text-zinc-700 font-medium transition flex items-center gap-1.5"
                  >
                    <Icon.Tag className="w-3.5 h-3.5 text-[#FF2E93]" />
                    <span className="hidden sm:inline">Mis Pedidos</span>
                  </button>
                )}

                {/* BOTÓN INICIAR SESIÓN CON GOOGLE (O PERFIL PERMANENTE) */}
                {!user ? (
                  <button
                    onClick={handleGoogleSignIn}
                    className="bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-300 text-xs px-3 py-2 rounded-full font-semibold flex items-center gap-2 shadow-xs transition hover:border-[#FF2E93]"
                  >
                    <Icon.Google className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Iniciar sesión</span>
                  </button>
                ) : (
                  <div className="relative">
                    <button
                      onClick={() => setIsProfileOpen(!isProfileOpen)}
                      className="flex items-center gap-2 bg-pink-50/70 hover:bg-pink-100/70 border border-pink-200 py-1.5 px-3 rounded-full text-xs font-semibold text-zinc-800 transition"
                    >
                      {user.user_metadata?.avatar_url ? (
                        <img src={user.user_metadata.avatar_url} alt="User" className="w-5 h-5 rounded-full border border-[#FF2E93]" />
                      ) : (
                        <span className="w-5 h-5 rounded-full bg-[#FF2E93] text-white flex items-center justify-center text-[10px] font-bold">
                          {user.email?.charAt(0).toUpperCase()}
                        </span>
                      )}
                      <span className="max-w-[80px] truncate hidden sm:inline">
                        {user.user_metadata?.full_name?.split(' ')[0] || user.email?.split('@')[0]}
                      </span>
                      {customerProfile?.customer_code && (
                        <span className="bg-[#FF2E93] text-white text-[10px] px-1.5 py-0.5 rounded-md font-bold">
                          {customerProfile.customer_code}
                        </span>
                      )}
                    </button>

                    {/* MENÚ DE PERFIL */}
                    {isProfileOpen && (
                      <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-zinc-200 p-4 z-50 text-xs space-y-3">
                        <div className="border-b pb-2">
                          <p className="font-bold text-zinc-900 truncate">{user.user_metadata?.full_name || 'Clienta Kaoj'}</p>
                          <p className="text-zinc-500 truncate text-[11px]">{user.email}</p>
                          {customerProfile?.customer_code && (
                            <div className="mt-2 bg-pink-50 border border-pink-200 text-[#FF2E93] rounded-lg p-2 text-center font-bold">
                              Código Permanente: {customerProfile.customer_code}
                            </div>
                          )}
                        </div>
                        <div className="space-y-1.5 text-zinc-600">
                          <p className="text-[11px] text-emerald-700 font-semibold flex items-center gap-1.5">
                            <Icon.Check className="w-3.5 h-3.5" /> Carrito sincronizado en la nube
                          </p>
                          <button
                            onClick={() => { setIsProfileOpen(false); setIsTrackingOpen(true); }}
                            className="w-full text-left py-1 hover:text-[#FF2E93] font-medium"
                          >
                            Ver mis compras realizadas
                          </button>
                        </div>
                        <button
                          onClick={handleLogout}
                          className="w-full bg-zinc-100 hover:bg-red-50 hover:text-red-600 text-zinc-700 py-2 rounded-xl font-bold transition text-center"
                        >
                          Cerrar Sesión
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* BOTÓN CARRITO */}
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="bg-[#FF2E93] hover:bg-[#e0157a] text-white px-3.5 sm:px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 shadow-xs transition active:scale-95"
                >
                  <Icon.Bag className="w-4 h-4" />
                  <span className="hidden sm:inline">Carrito</span>
                  <span className="bg-white text-[#FF2E93] text-xs font-black rounded-full px-2 py-0.5">
                    {cart.reduce((a, b) => a + b.qty, 0)}
                  </span>
                </button>
              </div>
            </div>

            {/* SECCIONES GRANDES (MAQUILLAJES | ACCESORIOS | ROPA) */}

                        {generateCustomerCode(user?.user_metadata?.full_name || 'K', phoneInputForGoogle)}
                      </span>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3 rounded-xl font-bold shadow-md transition"
                  >
                    Activar Código y Vincular a Google
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: AUTORIZACIÓN DE ADMINISTRADOR (PIN 091002)
              ========================================================================= */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative text-xs">
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-base text-zinc-900">Acceso Administrativo</h3>
                  <p className="text-zinc-500">Ingrese PIN de seguridad:</p>
                </div>

                <form onSubmit={e => {
                  e.preventDefault();
                  if (pinInput === '091002') {
                    setIsAdmin(true);
                    setShowPinModal(false);
                    setPinInput('');
                    showToast('Modo Administrador activado');
                  } else {
                    showToast('PIN incorrecto', 'error');
                  }
                }} className="space-y-3">
                  <input
                    type="password"
                    autoFocus
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    placeholder="PIN..."
                    className="w-full border rounded-xl p-3 text-center text-lg font-mono font-bold tracking-widest outline-none focus:ring-1 focus:ring-zinc-900"
                  />
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 bg-zinc-900 text-white py-2.5 rounded-xl font-bold">
                      Ingresar
                    </button>
                    <button type="button" onClick={() => setShowPinModal(false)} className="px-4 py-2.5 bg-zinc-100 rounded-xl font-bold text-zinc-600">
                      Cancelar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* DRAWER CARRITO */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex justify-end">
              <div className="bg-white w-full max-w-md h-full overflow-y-auto p-6 space-y-5 shadow-2xl flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b pb-4">
                    <div>
                      <h3 className="font-serif-kaoj text-2xl font-bold text-zinc-900">Tu Pedido</h3>
                      <span className="text-xs text-[#FF2E93] font-semibold">KAOJ STORE</span>
                    </div>
                    <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 rounded-full bg-zinc-100 flex items-center justify-center font-bold">✕</button>
                  </div>

                  {user && (
                    <div className="mt-3 bg-pink-50 border border-pink-200 rounded-xl p-2.5 text-xs text-zinc-700 flex items-center gap-2">
                      <Icon.Check className="w-4 h-4 text-emerald-600" />
                      <p>Sincronizado con Google: <b>{user.email}</b></p>
                    </div>
                  )}

                  {cart.length === 0 ? (
                    <div className="text-center py-16 space-y-3">
                      <Icon.Bag className="w-12 h-12 text-zinc-300 mx-auto" />
                      <p className="font-bold text-zinc-700 text-sm">Tu carrito está vacío</p>
                      <button onClick={() => setIsCartOpen(false)} className="bg-[#FF2E93] text-white px-5 py-2 rounded-full font-bold text-xs">

                      </button>
                    </div>

                    <div className="mt-4 space-y-3 divide-y divide-zinc-100">
                      {cart.map(item => (
                        <div key={item.key} className="pt-3 flex items-center justify-between gap-3 text-xs">
                          <img src={item.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'} alt={item.name} className="w-12 h-12 rounded-xl object-cover border" />
                          <div className="flex-1">
                            <p className="font-bold text-zinc-900 leading-tight">{item.name}</p>
                            <p className="text-zinc-500 text-[11px]">{item.variant}</p>
                            <span className="font-extrabold text-[#FF2E93]">${(item.price * item.qty).toFixed(2)}</span>
                          </div>
                          <div className="flex items-center gap-1.5 bg-zinc-50 border rounded-lg p-1">
                            <button onClick={() => updateCartQty(item.key, -1)} className="w-5 h-5 rounded bg-white flex items-center justify-center font-bold">-</button>
                            <span className="font-bold px-1.5">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.key, 1)} className="w-5 h-5 rounded bg-white flex items-center justify-center font-bold">+</button>
                          </div>
                          <button onClick={() => removeFromCart(item.key)} className="text-zinc-400 hover:text-red-500 font-bold px-1">✕</button>
                        </div>
                      ))}
                    </div>
                  )}

                  {cart.length > 0 && (
                    <form onSubmit={handleCheckoutSubmit} className="mt-6 space-y-4 text-xs">
                      <div className="border-t pt-4">
                        <h4 className="font-bold text-zinc-900 mb-2">Datos del Cliente</h4>
                        <div className="space-y-2">
                          <input required placeholder="Nombre y Apellido *" value={customer.name} onChange={e => setCustomer({ ...customer, name: e.target.value })} className="w-full border rounded-xl p-2.5 outline-none" />
                          <div className="grid grid-cols-2 gap-2">
                            <input required placeholder="Celular / WhatsApp *" value={customer.phone} onChange={e => setCustomer({ ...customer, phone: e.target.value })} className="border rounded-xl p-2.5 outline-none" />
                            <input placeholder="Cédula / RUC" value={customer.idCard} onChange={e => setCustomer({ ...customer, idCard: e.target.value })} className="border rounded-xl p-2.5 outline-none" />
                          </div>
                        </div>

                        {activeCustomerCode && (
                          <div className="mt-2.5 bg-pink-50 border border-pink-200 rounded-xl p-2.5 flex items-center justify-between">
                            <div>
                              <p className="text-[10px] text-zinc-500">Código Único de Cliente:</p>
                              <p className="text-sm font-black text-[#FF2E93] tracking-wider">{activeCustomerCode}</p>
                            </div>
                            <span className="text-[9px] bg-white text-[#FF2E93] border border-pink-200 px-2 py-0.5 rounded-full font-bold">
                              Permanente
                            </span>
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="font-bold text-zinc-700 block mb-1">Método de Entrega:</label>
                        <select value={customer.delivery} onChange={e => setCustomer({ ...customer, delivery: e.target.value })} className="w-full border rounded-xl p-2.5 bg-white outline-none">
                          {DELIVERY_OPTIONS.map(d => (
                            <option key={d.id} value={d.id}>{d.label} {d.price === 0 ? '(GRATIS)' : `(+$${d.price.toFixed(2)})`}</option>
                          ))}
                        </select>
                      </div>

                      {(customer.delivery === 'domicilio_local' || customer.delivery === 'envio_nacional') && (
                        <input required placeholder="Ciudad, sector y dirección de entrega *" value={customer.address} onChange={e => setCustomer({ ...customer, address: e.target.value })} className="w-full border rounded-xl p-2.5 outline-none" />
                      )}

                      <div>
                        <label className="font-bold text-zinc-700 block mb-1">Forma de Pago:</label>
                        <div className="grid grid-cols-3 gap-1.5">
                          <button type="button" onClick={() => setCustomer({ ...customer, paymentMethod: 'deuna' })} className={`py-2 rounded-xl font-bold text-[11px] border ${customer.paymentMethod === 'deuna' ? 'bg-purple-700 text-white' : 'bg-zinc-50'}`}>
                            Deuna!
                          </button>
                          <button type="button" onClick={() => setCustomer({ ...customer, paymentMethod: 'transferencia' })} className={`py-2 rounded-xl font-bold text-[11px] border ${customer.paymentMethod === 'transferencia' ? 'bg-[#FF2E93] text-white' : 'bg-zinc-50'}`}>
                            Bancos
                          </button>
                          <button type="button" onClick={() => setCustomer({ ...customer, paymentMethod: 'payphone' })} className={`py-2 rounded-xl font-bold text-[11px] border ${customer.paymentMethod === 'payphone' ? 'bg-zinc-900 text-white' : 'bg-zinc-50'}`}>
                            Payphone
                          </button>
                        </div>
                      </div>

                      {customer.paymentMethod === 'deuna' && (
                        <div className="bg-purple-50 border border-purple-200 rounded-2xl p-3 text-center space-y-2">
                          <p className="text-xs font-semibold text-purple-900">Escanea o abre tu app Deuna!:</p>
                          <a href={settings.deuna_link} target="_blank" rel="noreferrer" className="block w-full bg-purple-700 text-white py-2 rounded-xl font-bold">
                            Pagar con Deuna! (${total.toFixed(2)})
                          </a>
                        </div>
                      )}

                      {customer.paymentMethod === 'payphone' && (
                        <div className="bg-zinc-100 border rounded-2xl p-3 text-center space-y-2">
                          <p className="text-xs font-semibold text-zinc-900">Paga con tarjeta de crédito/débito:</p>
                          <a href={settings.payphone_link} target="_blank" rel="noreferrer" className="block w-full bg-zinc-900 text-white py-2 rounded-xl font-bold">
                            Pagar vía Payphone (${total.toFixed(2)})
                          </a>
                        </div>
                      )}

                      {customer.paymentMethod === 'transferencia' && (
                        <div className="bg-pink-50/70 border border-pink-200 rounded-2xl p-3 space-y-2">
                          <p className="font-bold text-[#FF2E93]">Cuentas Bancarias Kaoj Store</p>
                          <div className="bg-white p-2 rounded-xl border text-[11px]">
                            <p><b>Banco Guayaquil (Ahorros):</b> 0013899619</p>
                            <p className="text-zinc-500">Alisson Toledo • CI: 1350290308</p>
                          </div>
                          <div className="bg-white p-2 rounded-xl border text-[11px]">
                            <p><b>Banco Pichincha (Ahorros):</b> 2215807440</p>
                            <p className="text-zinc-500">Jhojann Demera • CI: 1314710946</p>
                          </div>
                        </div>
                      )}

                      {customer.paymentMethod !== 'payphone' && (
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 space-y-2">
                          <p className="font-bold text-amber-900">Sube la captura de tu comprobante:</p>
                          <input type="file" accept="image/*,application/pdf" onChange={async e => {
                            if (e.target.files[0]) {
                              const url = await uploadFileToSupabase(e.target.files[0], 'receipts');
                              if (url) setCustomer({ ...customer, receiptUrl: url });
                            }
                          }} className="w-full text-xs" />
                          {customer.receiptUrl && <p className="text-emerald-700 font-bold">Comprobante listo</p>}
                        </div>
                      )}

                      <div className="border-t pt-3 space-y-1">
                        <div className="flex justify-between"><span>Subtotal:</span><span>${subtotal.toFixed(2)}</span></div>
                        <div className="flex justify-between"><span>Envío:</span><span>{deliveryObj.price === 0 ? 'GRATIS' : `$${deliveryObj.price.toFixed(2)}`}</span></div>
                        <div className="flex justify-between text-base font-black text-zinc-900 pt-1 border-t">
                          <span>Total:</span><span className="text-[#FF2E93]">${total.toFixed(2)}</span>
                        </div>
                      </div>

                      <button type="submit" disabled={uploading} className="w-full bg-[#FF2E93] hover:bg-[#e0157a] text-white py-3.5 rounded-xl font-bold text-sm shadow-md transition">
                        Confirmar y Enviar a WhatsApp
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: VISTA RÁPIDA DE PRODUCTO */}
          {quickViewProduct && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-zinc-200 flex flex-col md:flex-row relative">
                <button onClick={() => setQuickViewProduct(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 flex items-center justify-center font-bold text-zinc-600 shadow-md z-10">✕</button>
                <div className="md:w-1/2 h-64 md:h-auto bg-zinc-50 relative">
                  <img src={quickViewProduct.image || 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600'} alt={quickViewProduct.name} className="w-full h-full object-cover" />

                <div className="p-6 md:w-1/2 flex flex-col justify-between space-y-4">
                  <div>
                    <span className="text-[10px] font-extrabold bg-pink-50 text-[#FF2E93] px-2 py-0.5 rounded-full">
                      {quickViewProduct.section} • {quickViewProduct.category}
                    </span>
                    <h3 className="font-bold text-xl text-zinc-900 mt-1">{quickViewProduct.name}</h3>
                    <p className="text-xs text-zinc-500 mt-2">{quickViewProduct.description}</p>
                    <div className="mt-4 flex items-baseline gap-2">
                      <span className="text-2xl font-black text-[#FF2E93]">${Number(quickViewProduct.discount_price || quickViewProduct.price).toFixed(2)}</span>
                      {quickViewProduct.discount_price && <span className="line-through text-zinc-400 text-sm">${Number(quickViewProduct.price).toFixed(2)}</span>}
                    </div>
                  </div>
                  <button onClick={() => addToCart(quickViewProduct)} className="w-full bg-[#FF2E93] text-white py-3 rounded-xl font-bold text-sm shadow-md transition">
                    Agregar al Carrito
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: RASTREO DE PEDIDOS */}
          {isTrackingOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-zinc-200 relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setIsTrackingOpen(false)} className="absolute top-4 right-4 text-zinc-400 font-bold text-xl">✕</button>
                <h3 className="font-serif-kaoj text-2xl font-bold text-zinc-900">Consulta de Pedidos</h3>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={trackingCode}
                    onChange={e => setTrackingCode(e.target.value)}
                    placeholder="Código Único (ej. J3456) o celular..."
                    className="flex-1 border rounded-xl p-2.5 text-xs outline-none font-bold uppercase"
                  />
                  <button onClick={async () => {
                    if (!trackingCode.trim()) return;
                    setTrackingLoading(true);
                    const { data } = await supabase.from('kaoj_orders').select('*').or(`customer_code.ilike.%${trackingCode.trim()}%,customer_phone.ilike.%${trackingCode.trim()}%`);
                    setTrackedOrders(data || []);
                    setTrackingLoading(false);
                  }} className="bg-[#FF2E93] text-white px-4 py-2.5 rounded-xl text-xs font-bold">
                    Buscar
                  </button>
                </div>
                {trackedOrders && (
                  <div className="space-y-2">
                    {trackedOrders.length === 0 ? <p className="text-xs text-zinc-500 text-center py-4">No hay pedidos registrados con ese código.</p> :
                      trackedOrders.map(o => (
                        <div key={o.id} className="border rounded-xl p-3 text-xs bg-zinc-50 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-[#FF2E93]">{o.order_code}</span>
                            <p className="text-zinc-500">{o.delivery_method} • ${Number(o.total).toFixed(2)}</p>
                          </div>
                          <span className="font-bold text-xs uppercase bg-white border px-2 py-0.5 rounded-md">{o.status}</span>
                        </div>
                      ))
                    }
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: GUÍA SERVIENTREGA */}
          {servientregaOrder && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative max-h-[95vh] overflow-y-auto">
                <div className="flex justify-between items-center no-print">
                  <h3 className="font-bold text-base text-zinc-900">Guía de Envío Servientrega</h3>
                  <button onClick={() => setServientregaOrder(null)} className="font-bold text-zinc-500 text-lg">✕</button>
                </div>

                <div id="servientrega-print-area" className="border-2 border-emerald-700 rounded-2xl p-5 bg-white text-zinc-900 space-y-4">
                  <div className="flex justify-between items-center border-b-2 border-emerald-700 pb-3">
                    <div>
                      <span className="bg-emerald-700 text-white font-black text-base px-3 py-1 rounded-md tracking-wider">SERVIENTREGA</span>
                      <p className="text-[10px] text-zinc-500 font-semibold mt-1">GUÍA DE ENVÍO NACIONAL</p>
                    </div>
                    <div className="text-right">
                      <span className="font-mono font-black text-sm">{servientregaOrder.order_code}</span>
                    </div>
                  </div>

                  <div className="text-center py-1 bg-zinc-50 rounded-lg border border-dashed border-zinc-300">
                    <p className="font-barcode text-4xl leading-none">*{servientregaOrder.order_code}*</p>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div className="border rounded-xl p-3 bg-zinc-50 space-y-1">
                      <p className="font-bold text-emerald-800 text-[11px] uppercase border-b pb-1">REMITENTE:</p>
                      <p className="font-bold">KAOJ STORE BOUTIQUE</p>
                      <p className="text-zinc-600">Portoviejo / Manta - Manabí</p>
                      <p className="text-zinc-600">Tel: +593 96 307 3456</p>
                    </div>

                    <div className="border-2 border-emerald-700 rounded-xl p-3 bg-emerald-50/30 space-y-1">
                      <p className="font-bold text-emerald-900 text-[11px] uppercase border-b border-emerald-200 pb-1">DESTINATARIO:</p>
                      <p className="font-bold text-sm">{servientregaOrder.customer_name}</p>
                      <p className="text-zinc-700">Celular: <b>{servientregaOrder.customer_phone}</b></p>
                      <p className="text-zinc-700">Dirección: <b>{servientregaOrder.delivery_address || 'Retiro Agencia'}</b></p>
                      <p className="text-emerald-800 font-bold text-[10px]">CÓDIGO ÚNICO: {servientregaOrder.customer_code}</p>
                    </div>
                  </div>

                  <div className="border rounded-xl p-3 text-xs space-y-1">
                    <div className="flex justify-between font-bold border-b pb-1">
                      <span>Contenido Declarado:</span><span>Total: ${Number(servientregaOrder.total).toFixed(2)}</span>
                    </div>
                    <div className="text-[11px] text-zinc-600 pt-1">
                      {(servientregaOrder.items || []).map((it, i) => (
                        <p key={i}>• {it.qty}x {it.name} ({it.variant})</p>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 no-print">
                  <button onClick={() => window.print()} className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-bold text-xs shadow-md">
                    Imprimir Guía (Térmica 10x15 o A4)
                  </button>
                  <button onClick={() => setServientregaOrder(null)} className="bg-zinc-100 text-zinc-700 px-4 py-3 rounded-xl font-bold text-xs">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* BOTÓN FLOTANTE WHATSAPP OFICIAL 593963073456 */}
          <a
            href="https://wa.me/593963073456?text=Hola%20Kaoj%20Store%2C%20quisiera%20consultar%20sobre%20sus%20productos."
            target="_blank"
            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-zinc-900 hover:bg-black text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition duration-200"
            title="WhatsApp Kaoj Store"
          >
            <Icon.WhatsApp className="w-6 h-6 text-emerald-400" />
          </a>

          {/* NOTIFICACIÓN TOAST */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2 bg-zinc-900 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl border border-zinc-800 animate-bounce">
              <Icon.Check className="w-4 h-4 text-[#FF2E93]" />
              <p className="font-semibold">{toast.message}</p>
            </div>
          )}

          {/* FOOTER DISCRETO */}
          <footer className="bg-white border-t border-zinc-200/80 mt-16 text-xs text-zinc-500 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-3 gap-8">
              <div className="space-y-2">
                <h4 className="font-serif-kaoj text-2xl font-black text-[#FF2E93]">KAOJ STORE</h4>
                <p>Maquillaje, accesorios y moda chic. Entregas en Portoviejo, ULEAM Manta, San Jacinto y envíos Servientrega a todo el Ecuador.</p>
              </div>

              <div>
                <h5 className="font-bold text-zinc-900 mb-2">Departamentos</h5>
                <ul className="space-y-1">
                  <li>Maquillajes (9 categorías)</li>
                  <li>Accesorios (Vinchas, Cintillos)</li>
                  <li>Ropa Chic (7 categorías)</li>
                </ul>
              </div>

              <div className="space-y-1">
                <h5 className="font-bold text-zinc-900 mb-2">Contacto Oficial</h5>
                <p>WhatsApp: <b>+593 96 307 3456</b></p>
                <p>Email: <b>kaoj.store.ecu@gmail.com</b></p>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 mt-8 border-t border-zinc-100 flex flex-col sm:flex-row justify-between items-center gap-2 text-zinc-400 text-[11px]">
              <p>© 2026 KAOJ STORE. Todos los derechos reservados.</p>

              {/* ACCESO DISCRETO ADMINISTRADOR */}
              <button
                onClick={() => setShowPinModal(true)}
                className="text-zinc-400 hover:text-zinc-600 transition flex items-center gap-1 opacity-40 hover:opacity-100"
                title="Acceso"
              >
                <Icon.Lock className="w-3 h-3" />
                <span>Gestión interna</span>
              </button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
